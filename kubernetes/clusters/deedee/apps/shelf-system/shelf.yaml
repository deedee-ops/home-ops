---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: shelf
spec:
  components:
    - ../../../components/kopiur
    - ../../../components/pgbackup
  dependsOn:
    - name: postgresql
      namespace: shelf-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: pocket-id-operator
      namespace: security
  interval: 1h
  patches:
    - patch: |-
        - op: replace
          path: /spec/scaleTargetRef/name
          value: shelf-dbbackup
      target:
        group: autoscaling
        kind: HorizontalPodAutoscaler
  path: ./kubernetes/apps/shelf-system/shelf
  postBuild:
    substitute:
      APP: shelf
      CLUSTER: deedee
      DBCLUSTER: shelf
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
      KOPIUR_CAPACITY: 20Gi
    substituteFrom:
      - kind: Secret
        name: shelf-oidc-credentials
        optional: true
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: shelf-system
