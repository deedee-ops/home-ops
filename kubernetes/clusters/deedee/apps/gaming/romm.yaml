---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: romm
spec:
  components:
    - ../../../components/dragonfly
    - ../../../components/nfs-scaler
    - ../../../components/pgbackup
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: postgresql
      namespace: gaming
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  patches:
    - target:
        kind: Dragonfly
      patch: |
        - op: replace
          path: /spec/resources/limits/memory
          value: 4Gi
        - op: replace
          path: /spec/args/1
          value: --proactor_threads=4
  path: ./kubernetes/apps/gaming/romm
  postBuild:
    substitute:
      APP: romm
      DBCLUSTER: gaming
      PGBACKUP_SECRET: romm-db-secret
      DRAGONFLY_STORAGE: 8Gi
      NFS_VOLUME: tank
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: gaming
