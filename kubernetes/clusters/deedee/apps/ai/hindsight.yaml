---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hindsight
spec:
  components:
    - ../../../components/oidc
  dependsOn:
    - name: postgresql
  interval: 1h
  path: ./kubernetes/apps/ai/hindsight
  postBuild:
    substitute:
      APP: hindsight
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  patches:
    - patch: |-
        - op: add
          path: /spec/targetRefs/0/sectionName
          value: app
      target:
        group: gateway.envoyproxy.io
        kind: SecurityPolicy
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: ai
  wait: false
