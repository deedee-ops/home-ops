---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: postgresql
spec:
  components:
    - ./components/postgresql
  dependsOn:
    - name: cloudnative-pg
      namespace: database
    - name: plugin-barman-cloud
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  healthChecks:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      namespace: default
      name: default-db
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      current: has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
      failed: >-
        has(status.phase) && status.phase in [
          'Cluster cannot execute instance online upgrade due to missing architecture binary',
          'Cluster cannot proceed to reconciliation due to an unknown plugin being required',
          'Cluster has incomplete or invalid image catalog',
          'Cluster is unrecoverable and needs manual intervention',
          'Invalid cluster definition',
          'Unable to create required cluster objects',
          'Waiting for user action'
        ]
  interval: 1h
  patches:
    - patch: |-
        apiVersion: postgresql.cnpg.io/v1
        kind: Cluster
        metadata:
          name: _
        spec:
          bootstrap:
            initdb:
              database: app
            # recovery:
            #   source: default-db-restore
            #   database: app
          managed:
            roles:
              - name: airtrail
                ensure: present
                login: true
                passwordSecret:
                  name: airtrail-db-secret
              - name: geopulse
                ensure: present
                login: true
                passwordSecret:
                  name: geopulse-db-secret
              - name: wikijs
                ensure: present
                login: true
                passwordSecret:
                  name: wikijs-db-secret
          postgresql:
            extensions:
              - name: postgis
                image:
                  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgis-extension
                  reference: ghcr.io/cloudnative-pg/postgis-extension:3.7.0-202611271432-18-bookworm@sha256:72b21fe20115da45e56ea633da4aa7932637057812bef0515f1aae7f7ef9987d
                ld_library_path:
                  - system
      target:
        group: postgresql.cnpg.io
        kind: Cluster
  path: ./kubernetes
  postBuild:
    substitute:
      APP: default
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      PGDB_IMAGE: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:4eae19c85f20f9ad1457b25f0dfeabef8673e67a96a6fa37ef91e6af343d6631
      PGDB_SERVER_NAME: default-db
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: true
