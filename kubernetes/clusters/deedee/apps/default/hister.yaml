---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hister
spec:
  components:
    - ../../../components/kopiur
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  patches: []
  path: ./kubernetes/apps/default/hister
  postBuild:
    substitute:
      APP: hister
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PUID: "65532"
      KOPIUR_GID: "65532"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
