---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: nitter
spec:
  components:
    - ../../../components/dragonfly
  dependsOn:
    - name: dragonfly-operator
      namespace: database
  interval: 1h
  patches: []
  path: ./kubernetes/apps/default/nitter
  postBuild:
    substitute:
      APP: nitter
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false
