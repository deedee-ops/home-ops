---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gitea-mirror
spec:
  components:
    - ../../../components/kopiur
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  patches: []
  path: ./kubernetes/apps/forgejo-system/gitea-mirror
  postBuild:
    substitute:
      APP: gitea-mirror
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
      KOPIUR_CAPACITY: 10Gi
      KOPIUR_PGID: "1001"
      KOPIUR_PUID: "1001"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: forgejo-system
  wait: false
