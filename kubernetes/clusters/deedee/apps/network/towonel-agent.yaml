---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: towonel-agent
spec:
  dependsOn:
    - name: external-dns-cloudflare
      namespace: network
  interval: 1h
  patches: []
  path: ./kubernetes/apps/network/towonel-agent
  postBuild:
    substitute:
      EXTERNAL_ROOT_DOMAIN: "${EXTERNAL_ROOT_DOMAIN}"
      VPS_IP: "${VPS_IP}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: network
  wait: false
