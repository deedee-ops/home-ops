---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: romm
spec:
  components:
    - ../../../components/dragonfly
    - ../../../components/nfs-scaler
    - ../../../components/pgbackup
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  patches:
    - target:
        kind: Dragonfly
      patch: |
        - op: replace
          path: /spec/resources/limits/memory
          value: 4Gi
  path: ./kubernetes/apps/media/romm
  postBuild:
    substitute:
      APP: romm
      DBCLUSTER: media
      DRAGONFLY_STORAGE: 8Gi
      NFS_VOLUME: tank
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
