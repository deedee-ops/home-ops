---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ps5lh
spec:
  components:
    - ../../../components/nfs-scaler
  interval: 1h
  patches: []
  path: ./kubernetes/apps/media/ps5lh
  postBuild:
    substitute:
      APP: ps5lh
      NFS_VOLUME: tank
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: ps5lh-gateway
spec:
  interval: 1h
  patches: []
  path: ./kubernetes/apps/media/ps5lh/gateway
  postBuild:
    substitute:
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
