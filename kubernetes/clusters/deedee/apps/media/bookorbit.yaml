---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: bookorbit
spec:
  components:
    - ../../../components/kopiur
    - ../../../components/nfs-scaler
    - ../../../components/pgbackup
  dependsOn:
    - name: rook-ceph-cluster
      namespace: rook-ceph
  interval: 1h
  path: ./kubernetes/apps/media/bookorbit
  postBuild:
    substitute:
      APP: bookorbit
      CLUSTER: deedee
      DBCLUSTER: media
      NFS_VOLUME: tank
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
