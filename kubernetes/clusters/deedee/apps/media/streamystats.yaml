---
# yaml-language-server: $schema=https://schemas.ajgon.casa/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: streamystats
spec:
  components:
    - ../../../components/pgbackup
  dependsOn:
    - name: postgresql
      namespace: media
  interval: 1h
  path: ./kubernetes/apps/media/streamystats
  postBuild:
    substitute:
      APP: streamystats
      DBCLUSTER: media
      PGBACKUP_SECRET: streamystats-db-secret
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
  patches: []
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: media
