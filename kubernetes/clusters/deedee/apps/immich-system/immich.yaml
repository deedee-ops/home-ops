---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: immich
spec:
  components:
    - ../../../components/kopiur
    - ../../../components/dragonfly
    - ../../../components/gpu
  dependsOn:
    - name: dragonfly-operator
      namespace: database
    - name: postgresql
      namespace: immich-system
    - name: intel-gpu-resource-driver
      namespace: kube-system
    - name: rook-ceph-cluster
      namespace: rook-ceph
    - name: pocket-id-operator
      namespace: security
  interval: 1h
  patches:
    - target:
        kind: Dragonfly
      patch: |
        - op: add
          path: /spec/args/-
          value: --default_lua_flags=allow-undeclared-keys
  path: ./kubernetes/apps/immich-system/immich
  postBuild:
    substitute:
      APP: immich
      CLUSTER: deedee
      ROOT_DOMAIN: "${ROOT_DOMAIN}"
      KOPIUR_ACCESSMODES: ReadWriteMany
      KOPIUR_CAPACITY: 50Gi
      KOPIUR_SCHEDULE: "0 1 * * *"
      KOPIUR_SNAPSHOTCLASS: csi-ceph-filesystem
      KOPIUR_STAGING_ACCESSMODES: '["ReadOnlyMany"]'
      KOPIUR_STAGING_STORAGECLASS: ceph-filesystem-shallow
      KOPIUR_STORAGECLASS: ceph-filesystem
    substituteFrom:
      - kind: Secret
        name: immich-oidc-credentials
        optional: true
  prune: true
  retryInterval: 30s
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: immich-system
