---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-backblaze-b2
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kopiur-backblaze-b2-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .B2_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .B2_AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/kopiur-system/kopiur
---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kopiur-nas
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: kopiur-nas-secret
    template:
      data:
        KOPIA_PASSWORD: "{{ .KOPIA_PASSWORD }}"
        AWS_ACCESS_KEY_ID: "{{ .NAS_AWS_ACCESS_KEY_ID }}"
        AWS_SECRET_ACCESS_KEY: "{{ .NAS_AWS_SECRET_ACCESS_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/kopiur-system/kopiur
