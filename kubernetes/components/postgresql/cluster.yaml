---
# yaml-language-server: $schema=https://schemas.ajgon.casa/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: ${APP}-db
  annotations:
    cnpg.io/skipEmptyWalArchiveCheck: "enabled"
spec:
  instances: 3
  # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
  imageName: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:4eae19c85f20f9ad1457b25f0dfeabef8673e67a96a6fa37ef91e6af343d6631
  enableSuperuserAccess: false
  inheritedMetadata:
    labels:
      egress.cilium.io/kube-apiserver: "true"
      egress.cilium.io/nas: "true"
  primaryUpdateStrategy: unsupervised
  primaryUpdateMethod: switchover
  stopDelay: 180
  smartShutdownTimeout: 180
  storage:
    size: ${PGDB_CAPACITY:=10Gi}
    storageClass: ${PGDB_STORAGE_CLASS:=ceph-block}
  walStorage:
    size: ${PGDB_WAL_CAPACITY:=8Gi}
    storageClass: ${PGDB_STORAGE_CLASS:=ceph-block}
  resources:
    requests:
      cpu: ${PGDB_CPU_REQUEST:=100m}
      memory: ${PGDB_MEMORY_REQUEST:=1Gi}
  postgresql:
    parameters:
      max_connections: "300"
      shared_buffers: 512MB
      max_slot_wal_keep_size: 3GB
  monitoring:
    enablePodMonitor: true
  priorityClassName: cnpg-instance
  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
    podAntiAffinityType: required
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: ${APP}-db-store
        serverName: ${APP}-db
  externalClusters:
    - name: ${APP}-db-restore
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: ${APP}-db-store
          serverName: ${APP}-db
