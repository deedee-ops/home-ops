---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/kopiur.home-operations.com/restore_v1alpha1.json
apiVersion: kopiur.home-operations.com/v1alpha1
kind: Restore
metadata:
  name: ${APP}
spec:
  mover:
    securityContext:
      runAsUser: ${KOPIUR_PUID:=1000}
      runAsGroup: ${KOPIUR_PGID:=1000}
  policy:
    onMissingSnapshot: Continue
  repository:
    kind: ClusterRepository
    name: nas
  source:
    fromPolicy:
      name: ${APP}
      offset: 0
  target:
    populator: {}
