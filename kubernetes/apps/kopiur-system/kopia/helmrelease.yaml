---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopia
spec:
  chartRef:
    kind: OCIRepository
    name: kopia
  interval: 1h
  values:
    controllers:
      main:
        containers:
          app:
            args:
              - --without-password
            image:
              repository: ghcr.io/home-operations/kopia
              tag: 0.23.1@sha256:27da0a33b44e1b902150a6c963514237217464bb13118a95bb056667be93cda5
            env:
              KOPIA_WEB_ENABLED: true
              KOPIA_WEB_PORT: &port 80
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: kopia-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        app.kubernetes.io/managed-by: kopiur
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      main:
        ports:
          app:
            port: *port
    route:
      main:
        hostnames:
          - "kopia.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: kopia
                port: 80
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Content-Security-Policy
                      value: >-
                        default-src 'self';
                        object-src 'none';
                        style-src 'self' 'unsafe-inline';
    configMaps:
      config:
        data:
          repository.config: |-
            {
              "storage": {
                "type": "s3",
                "config": {
                  "bucket": "backup-homelab",
                  "endpoint": "s3.${ROOT_DOMAIN}",
                  "region": "eu-central-1"
                }
              },
              "hostname": "kopiur",
              "username": "kopiur",
              "description": "kopiur",
              "enableActions": false
            }
    persistence:
      config:
        type: configMap
        identifier: config
        advancedMounts:
          main:
            app:
              - path: /config/repository.config
                subPath: repository.config
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        globalMounts:
          - path: /etc/ssl/certs/ca-certificates.crt
            subPath: ca.crt
            readOnly: true
      tmpfs:
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /config/cache
                subPath: cache
              - path: /config/logs
                subPath: logs
              - path: /tmp
                subPath: tmp
