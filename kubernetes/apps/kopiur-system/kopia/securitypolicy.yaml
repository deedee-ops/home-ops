---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: kopia-backblaze-b2
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: kopia-backblaze-b2
  oidc:
    provider:
      issuer: https://id.ajgon.casa
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: pocket-id
          namespace: security
          port: 443
    clientIDRef:
      group: ""
      kind: Secret
      name: kopia-oidc-credentials
    clientSecret:
      group: ""
      kind: Secret
      name: kopia-oidc-credentials
    redirectURL: https://kopia-b2.ajgon.casa/oauth2/callback
    logoutPath: /logout
---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/gateway.envoyproxy.io/securitypolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
