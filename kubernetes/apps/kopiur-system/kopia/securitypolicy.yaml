      issuer: https://id.ajgon.casa
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: pocket-id
          namespace: security
          port: 443
    clientIDRef:
      group: ""
      kind: Secret
      name: kopia-oidc-credentials
    clientSecret:
      group: ""
      kind: Secret
      name: kopia-oidc-credentials
    redirectURL: https://kopia-nas.ajgon.casa/oauth2/callback
    logoutPath: /logout
