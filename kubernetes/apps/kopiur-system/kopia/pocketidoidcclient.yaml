---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: kopia
spec:
  pkceEnabled: true
  launchUrl: https://kopia.ajgon.casa
  callbackUrls:
    - https://kopia.${ROOT_DOMAIN}/oauth2/callback
  allowedUserGroups:
    - name: admins
      namespace: security
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
