---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/configmap-v1.json
apiVersion: v1
kind: ConfigMap
metadata:
  name: kopiur-blob-sweep
data:
  repository.config: |-
    {
      "storage": {
        "type": "s3",
        "config": {
          "bucket": "ajgon-homelab",
          "endpoint": "s3.eu-central-003.backblazeb2.com",
          "region": "eu-central-003"
        }
      },
      "hostname": "kopiur",
      "username": "kopiur",
      "description": "blob-sweep",
      "enableActions": false
    }
  probe.sh: |-
    #!/bin/sh
    set -u
    out=$(curl -sS -o /dev/null -w '%{http_code} %{size_download}' \
      --max-time 30 --retry 2 -r 0-0 \
      --aws-sigv4 "aws:amz:${AWS_REGION}:s3" \
      --user "${AWS_ACCESS_KEY_ID}:${AWS_SECRET_ACCESS_KEY}" \
      "${S3_ENDPOINT}/${S3_BUCKET}/$1" 2>/dev/null)
    rc=$?
    [ -n "${out}" ] || out="000 0"
    code=${out%% *}
    got=${out##* }
    if [ "$code" != "206" ] || [ "$got" != "1" ]; then
      echo "BAD http=${code} bytes=${got} curl=${rc} $1"
    fi
  sweep.sh: |-
    #!/bin/sh
    set -eu
    total=$(wc -l < /work/blobs.txt)
    echo "probing ${total} blobs in ${S3_BUCKET}"
    xargs -P "${PARALLEL}" -n 1 /scripts/probe.sh < /work/blobs.txt > /work/bad.txt
    bad=$(wc -l < /work/bad.txt)
    if [ "${bad}" -gt 0 ]; then
      echo "DAMAGED BLOBS: ${bad} of ${total}"
      cat /work/bad.txt
      exit 1
    fi
    echo "all ${total} blobs readable"
---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kopiur-blob-sweep-backblaze-b2
spec:
  schedule: "0 6 * * *"
  timeZone: Europe/Warsaw
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        metadata:
          labels:
            app.kubernetes.io/managed-by: kopiur
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          enableServiceLinks: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            - name: list
              image: ghcr.io/home-operations/kopia:0.23.1
              command:
                - /bin/sh
                - -c
                - kopia --config-file=/scripts/repository.config blob list | awk 'NF>=3 {print $1}' > /work/blobs.txt
              env:
                - name: HOME
                  value: /tmp
                - name: KOPIA_CACHE_DIRECTORY
                  value: /tmp/cache
                - name: KOPIA_LOG_DIR
                  value: /tmp/logs
              envFrom:
                - secretRef:
                    name: kopiur-backblaze-b2-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          containers:
            - name: probe
              image: docker.io/curlimages/curl:8.11.1
              command:
                - /scripts/sweep.sh
              env:
                - name: HOME
                  value: /tmp
                - name: PARALLEL
                  value: "24"
                - name: AWS_REGION
                  value: eu-central-003
                - name: S3_ENDPOINT
                  value: https://s3.eu-central-003.backblazeb2.com
                - name: S3_BUCKET
                  value: ajgon-homelab
              envFrom:
                - secretRef:
                    name: kopiur-backblaze-b2-secret
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: work
                  mountPath: /work
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: scripts
              configMap:
                name: kopiur-blob-sweep
                defaultMode: 0755
            - name: work
              emptyDir: {}
            - name: tmp
              emptyDir: {}
