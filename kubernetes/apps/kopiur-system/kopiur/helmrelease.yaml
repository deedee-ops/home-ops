---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/kopiur-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kopiur
spec:
  chartRef:
    kind: OCIRepository
    name: kopiur
  interval: 1h
  values:
    extraVolumes:
      - name: homelab-root-ca
        configMap:
          name: homelab-root-ca
          defaultMode: 420
    extraVolumeMounts:
      - mountPath: /etc/ssl/certs/ca-certificates.crt
        name: homelab-root-ca
        subPath: ca.crt
        readOnly: true
    monitoring:
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
      prometheusRule:
        enabled: true
      serviceMonitor:
        enabled: true
    podLabels:
      egress.cilium.io/kube-apiserver: "true"
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    resources:
      requests:
        cpu: 100m
      limits:
        memory: 2Gi
    webhook:
      podLabels:
        egress.cilium.io/kube-apiserver: "true"
