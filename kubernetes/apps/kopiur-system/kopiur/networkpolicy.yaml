---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: kopiur-egress-external
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/managed-by: kopiur
  egress:
    - toFQDNs:
        - matchName: s3.eu-central-003.backblazeb2.com
      toPorts:
        - ports:
            - port: "443"
    - toCIDRSet:
        - cidr: 192.168.42.10/32 # NAS
      toPorts:
        - ports:
            - port: "443"
    - toEntities:
        - kube-apiserver
