---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: music-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: music-assistant
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: music-assistant
          glance/icon: di:music-assistant
          glance/url: https://music.${ROOT_DOMAIN}
        type: statefulset
        containers:
          app:
            image: &image
              repository: ghcr.io/music-assistant/server
              tag: 2.10.4@sha256:37a9a2776e838a754c9f5b38c432567389952304e7cb8f6b44b6cd28043de6de
            env:
              TZ: Europe/Warsaw
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /info
                    port: &port 8095
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
        # MA keeps all config in /data/settings.json and has no env/CLI override for it,
        # and its own auto-detect always picks the default-route address (eth0) over the
        # macvlan. This resolves the macvlan IP the same way MA does - inverted - and
        # pins it before the app starts. Set PUBLISH_IP to override; more than one
        # non-primary IPv4 (e.g. a second macvlan attachment) fails loudly by design.
        initContainers:
          publish-ip:
            image: *image
            command:
              - "python3"
              - "-c"
            args:
              - |
                import ifaddr, ipaddress, json, os, pathlib, socket, sys
                ip = os.environ.get("PUBLISH_IP", "")
                if not ip:
                    s = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                    try:
                        s.connect(("10.254.254.254", 1))
                        primary = s.getsockname()[0]
                    finally:
                        s.close()
                    found = []
                    for ad in ifaddr.get_adapters():
                        for a in ad.ips:
                            if not a.is_IPv4 or a.ip == primary:
                                continue
                            addr = ipaddress.ip_address(a.ip)
                            if addr.is_loopback or addr.is_link_local:
                                continue
                            found.append((ad.name, a.ip))
                    if len(found) != 1:
                        sys.exit(f"need exactly 1 non-primary IPv4, found {found} (primary={primary})")
                    ip = found[0][1]
                p = pathlib.Path("/data/settings.json")
                d = json.loads(p.read_text()) if p.exists() else {}
                core = d.setdefault("core", {})
                web = core.setdefault("webserver", {}).setdefault("values", {})
                core.setdefault("streams", {}).setdefault("values", {})["publish_ip"] = ip
                web["base_url"] = os.environ["BASE_URL"]
                p.write_text(json.dumps(d, indent=2))
                print(f"pinned publish_ip={ip} base_url={web['base_url']}")
            env:
              BASE_URL: https://music.${ROOT_DOMAIN}
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        statefulset:
          volumeClaimTemplates:
            - name: cache
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 1Gi
              advancedMounts:
                app:
                  - path: /.cache
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot",
            "namespace": "kube-system",
            "ips": ["192.168.3.33/24"],
            "mac": "02:00:c0:a8:03:21"
          }]
      labels:
        egress.cilium.io/internet: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        hostnames:
          - "music.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: music-assistant
                port: 80
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Content-Security-Policy
                      value: >-
                        default-src 'self' data: blob:;
                        object-src 'none';
                        img-src 'self' data: blob: https:;
                        script-src 'self' 'unsafe-inline' 'unsafe-eval';
                        style-src 'self' 'unsafe-inline';
    persistence:
      data:
        existingClaim: music-assistant
      tmp:
        type: emptyDir
        globalMounts:
          - subPath: tmp
            path: /tmp
