---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: home-assistant
spec:
  pkceEnabled: true
  launchUrl: https://home.${ROOT_DOMAIN}
  callbackUrls:
    - "https://home.${ROOT_DOMAIN}/auth/oidc/callback"
  secret:
    keys:
      clientID: HASS_OIDC_CLIENT_ID
      clientSecret: HASS_OIDC_CLIENT_SECRET
