---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: home-assistant-secret
    template:
      data:
        HASS_PROMETHEUS_METRICS_API_KEY: "{{ .HASS_PROMETHEUS_METRICS_API_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/home/home-assistant
