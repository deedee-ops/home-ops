---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: home-assistant
spec:
  chartRef:
    kind: OCIRepository
    name: home-assistant
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: Home Assistant
          glance/icon: di:home-assistant
          glance/url: https://home.${ROOT_DOMAIN}
        pod:
          labels:
            egress.cilium.io/auth: "true"
            egress.cilium.io/nut: "true"
            egress.cilium.io/smtp-relay: "true"
        type: statefulset
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/home-assistant
              tag: 2026.9.0@sha256:f795a47fa14a5b109cc524b7f7e8b3d9ab95665d0482d9a11b794b6ad8425baa
            env:
              HASS_OIDC_DISCOVERY_URL: "https://id.ajgon.casa/.well-known/openid-configuration"
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: home-assistant-secret
              - secretRef:
                  name: home-assistant-oidc-credentials
            ports:
              - containerPort: 80
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
        statefulset:
          volumeClaimTemplates:
            - name: cache
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 1Gi
              advancedMounts:
                app:
                  - path: /config/.venv
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "iot-nowan",
            "namespace": "kube-system",
            "ips": ["192.168.3.30/24"],
            "mac": "02:00:c0:a8:03:1e"
          },{
            "name": "iot-wan",
            "namespace": "kube-system",
            "ips": ["192.168.4.30/24"],
            "mac": "02:00:c0:a8:04:1e"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            appProtocol: kubernetes.io/ws
            port: 80
    route:
      app:
        hostnames:
          - "home.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: home-assistant
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        globalMounts:
          - path: /etc/ssl/certs/ca-certificates.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - subPath: logs
            path: /config/logs
          - subPath: tts
            path: /config/tts
          - subPath: tmp
            path: /tmp
