---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cronjob-batch-v1.json
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag-blossom
spec:
  schedule: "0 0 * * 1,4"
  jobTemplate:
    spec:
      template:
        spec:
          automountServiceAccountToken: false
          enableServiceLinks: false
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: talosctl
              image: ghcr.io/siderolabs/talosctl:v1.14.6@sha256:82c9a9985fc7292a222e680414c65955ac0566db588b84d88f620b05d16b1d5b
              args:
                - etcd
                - defrag
                - -n
                - blossom
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: talos-secrets
                  mountPath: /var/run/secrets/talos.dev
                  readOnly: true
          volumes:
            - name: talos-secrets
              secret:
                secretName: tuppr-talosconfig
