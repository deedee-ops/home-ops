---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: alloy-egress-cluster
specs:
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: alloy
    egress:
      - toEndpoints:
          - matchLabels:
              app.kubernetes.io/name: alloy
        toPorts:
          - ports:
              - port: "12345"
