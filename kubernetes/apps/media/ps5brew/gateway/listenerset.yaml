---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.networking.k8s.io/listenerset_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: ps5brew
spec:
  parentRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: envoy-internal
  listeners:
    - name: https-ps5brew
      protocol: HTTPS
      port: 443
      hostname: "ps5brew.${ROOT_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: external-tls
    - name: https-manuals-playstation
      protocol: HTTPS
      port: 443
      hostname: "manuals.playstation.net"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: ps5brew-manuals-tls
    - name: http-manuals-playstation
      protocol: HTTP
      port: 80
      hostname: "manuals.playstation.net"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: media
