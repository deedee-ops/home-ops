---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps5brew
spec:
  chartRef:
    kind: OCIRepository
    name: ps5brew
  interval: 1h
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: registry.ajgon.casa/tools/ps5brew
              tag: latest@sha256:8707b3661f66d454426aff5b6b85d31fc9c53e2c4a391c00a3bdcd0bc89c0fb3
            args:
              - "--payloads.name=ps5brew.${ROOT_DOMAIN}"
            env:
              PS5BREW_SERVER__PORT: &port 8080
              PS5BREW_SERVER__URL: https://ps5brew.${ROOT_DOMAIN}
              PS5BREW_STORE__CATALOGS: https://homebrew.page/api/v1/
              PS5BREW_STORAGE__DATA: /data
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        hostnames:
          - "ps5brew.${ROOT_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: ps5brew
            namespace: network
            sectionName: https-ps5brew
        rules:
          - backendRefs:
              - kind: Service
                name: ps5brew
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /
      manuals:
        hostnames:
          - "manuals.playstation.net"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: ps5brew
            namespace: network
            sectionName: https-manuals-playstation
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: ps5brew
            namespace: network
            sectionName: http-manuals-playstation
        rules:
          - backendRefs:
              - kind: Service
                name: ps5brew
                port: *port
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=0
            matches:
              - path:
                  type: PathPrefix
                  value: /
    persistence:
      data:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: nas.internal
              share: "/mnt/tank/retro/ps5brew"
              mountOptions: "noac,nfsvers=4.1,nconnect=16,hard,noatime"
        globalMounts:
          - path: /data
