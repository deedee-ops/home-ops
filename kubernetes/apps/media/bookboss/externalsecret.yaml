---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bookboss
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: bookboss-secret
    template:
      data:
        BOOKBOSS__ENCRYPTION_SECRET: "{{ .BOOKBOSS__ENCRYPTION_SECRET }}"
        BOOKBOSS__METADATA__GOOGLEBOOKS_API_TOKEN: "{{ .BOOKBOSS__METADATA__GOOGLEBOOKS_API_TOKEN }}"
        BOOKBOSS__METADATA__HARDCOVER_API_TOKEN: "{{ .BOOKBOSS__METADATA__HARDCOVER_API_TOKEN }}"
  dataFrom:
    - extract:
        key: kubernetes/default/bookboss
