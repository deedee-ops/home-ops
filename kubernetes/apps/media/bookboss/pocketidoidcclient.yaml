---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: bookboss
spec:
  launchUrl: https://bookboss.${ROOT_DOMAIN}
  callbackUrls:
    - "https://bookboss.${ROOT_DOMAIN}/auth/oidc/callback"
  secret:
    keys:
      clientID: BOOKBOSS__OIDC__CLIENT_ID
      clientSecret: BOOKBOSS__OIDC__CLIENT_SECRET
