---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: recyclarr
spec:
  chartRef:
    kind: OCIRepository
    name: recyclarr
  interval: 1h
  values:
    controllers:
      main:
        type: cronjob
        forceRename: recyclarr
        cronjob:
          schedule: 0 12 * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/recyclarr/recyclarr
              tag: 8.8.1@sha256:3e9c41b9ec29bbf65fe846864058730d321a21f7695d8c0d9437b73e34d50ad9
            envFrom:
              - secretRef:
                  name: "recyclarr-secret"
            args:
              - sync
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
      cutoff-search:
        type: cronjob
        cronjob:
          schedule: 17 4 * * 0
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        containers:
          app:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:ff88728f0d5fe50a9984f6cc04d7d1185590b628f29ef4e6a3ec8cae7169e0c8
            envFrom:
              - secretRef:
                  name: "recyclarr-secret"
            command:
              - /bin/sh
              - -c
            args:
              - |
                set -eu
                wget -qO- --header "X-Api-Key: $${SONARR_API_KEY}" --header "Content-Type: application/json" \
                  --post-data '{"name":"CutoffUnmetEpisodeSearch","monitored":true}' http://sonarr/api/v3/command
                wget -qO- --header "X-Api-Key: $${RADARR_API_KEY}" --header "Content-Type: application/json" \
                  --post-data '{"name":"CutoffUnmetMoviesSearch"}' http://radarr/api/v3/command
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 8Mi
              limits:
                memory: 32Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    persistence:
      config:
        existingClaim: recyclarr
        advancedMounts:
          main:
            app:
              - path: /config
      config-file:
        type: configMap
        name: "recyclarr-configmap"
        advancedMounts:
          main:
            app:
              - path: /config/recyclarr.yml
                subPath: recyclarr.yml
      tmp:
        type: emptyDir
        advancedMounts:
          main:
            app:
              - path: /tmp
