---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: streamystats-secret
    template:
      data:
        INTERNAL_API_KEY: "{{ .INTERNAL_API_KEY }}"
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "{{ .NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
  dataFrom:
    - extract:
        key: kubernetes/media/streamystats
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: streamystats-db-secret
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: streamystats
        password: "{{ .password }}"
        host: media-db-rw
        port: "5432"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: media-db-password
