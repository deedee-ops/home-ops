---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: streamystats
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: streamystats-secret
    template:
      data:
        INTERNAL_API_KEY: "{{ .INTERNAL_API_KEY }}"
        NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: "{{ .NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}"
        SESSION_SECRET: "{{ .SESSION_SECRET }}"
  dataFrom:
    - extract:
        key: kubernetes/media/streamystats
