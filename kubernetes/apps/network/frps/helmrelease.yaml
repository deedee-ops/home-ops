---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: frps
spec:
  chartRef:
    kind: OCIRepository
    name: frps
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/fatedier/frps
              tag: v0.71.1@sha256:48720c81f048e842f7f0b8053753c1a8514053d59d2dee8a953f67995de73a18
            args:
              - -c
              - /etc/frp/frps.toml
            env:
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: frps-secret
            probes:
              liveness:
                enabled: true
              readiness:
                enabled: true
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        controller: main
        ports:
          http:
            primary: true
            port: 80
            targetPort: 8080
      control:
        controller: main
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "frp.${ROOT_DOMAIN}"
          lbipam.cilium.io/ips: 192.168.42.36
        externalTrafficPolicy: Cluster
        ports:
          control:
            port: 7000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 404"]
            url: "https://share.${ROOT_DOMAIN}/"
        hostnames:
          - "share.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - method: GET
                path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - identifier: app
                port: 80
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Referrer-Policy
                      value: no-referrer
                    - name: X-Robots-Tag
                      value: noindex, nofollow
    persistence:
      config:
        type: configMap
        name: frps-configmap
        globalMounts:
          - path: /etc/frp/404.html
            subPath: 404.html
            readOnly: true
          - path: /etc/frp/frps.toml
            subPath: frps.toml
            readOnly: true
      tls:
        type: secret
        name: frps-tls
        globalMounts:
          - path: /tls
            readOnly: true
