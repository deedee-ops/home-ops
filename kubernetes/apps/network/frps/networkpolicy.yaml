---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: frps-ingress
specs:
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: frps
    ingress:
      - fromEndpoints:
          - matchLabels:
              io.kubernetes.pod.namespace: network
              gateway.envoyproxy.io/owning-gateway-name: envoy-external
        toPorts:
          - ports:
              - port: "8080"
      - fromCIDRSet:
          - cidr: 192.168.0.0/16
        toPorts:
          - ports:
              - port: "7000"
