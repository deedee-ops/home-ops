---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: towonel-agent
spec:
  chartRef:
    kind: OCIRepository
    name: towonel-agent
  interval: 1h
  values:
    controllers:
      main:
        replicas: 2
    agent:
      services:
        - hostname: "*.${EXTERNAL_ROOT_DOMAIN}"
          origin: envoy-external:443
      inviteTokenSecret:
        name: towonel-agent-secret
    serviceMonitor:
      main:
        enabled: true
