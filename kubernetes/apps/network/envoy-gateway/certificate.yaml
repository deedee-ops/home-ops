---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: internal
spec:
  secretName: internal-tls
  issuerRef:
    name: openbao
    kind: ClusterIssuer
  commonName: "${ROOT_DOMAIN}"
  dnsNames:
    - "${ROOT_DOMAIN}"
    - "*.${ROOT_DOMAIN}"
    - "*.crypt.${ROOT_DOMAIN}"
---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external
spec:
  secretName: external-tls
  duration: 168h
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  privateKey:
    algorithm: ECDSA
    size: 256
    rotationPolicy: Always
  usages:
    - digital signature
  commonName: "${EXTERNAL_ROOT_DOMAIN}"
  dnsNames:
    - "${EXTERNAL_ROOT_DOMAIN}"
    - "*.${EXTERNAL_ROOT_DOMAIN}"
