---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.envoyproxy.io/envoyproxy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: envoy
spec:
  logging:
    level:
      default: info
  provider:
    type: Kubernetes
    kubernetes:
      # One envoy per node, so every node that advertises the LB IPs has a backend.
      envoyDaemonSet:
        pod:
          labels:
            egress.cilium.io/kube-apiserver: "true"
        container:
          resources:
            requests:
              cpu: 25m
              memory: 256Mi
            limits:
              memory: 2Gi
        # start the new pod before stopping the old one on each node
        strategy:
          type: RollingUpdate
          rollingUpdate:
            maxSurge: 1
            maxUnavailable: 0
      envoyService:
        # Cluster, not Local: UniFi ECMPs the BGP-advertised LB IPs over all nodes and can split a single
        # flow across them (seen with syncthing re-dialing from a fixed source port). Cilium maglev picks
        # the same envoy on every node, so split flows still land on one backend. Client IPs survive only
        # because Cilium runs loadBalancer.mode=dsr; snat or hybrid would hide them behind node IPs.
        externalTrafficPolicy: Cluster
  shutdown:
    # syncthing keeps the connection open all the time, so each timeout will be saturated
    # so better keep it short, to speed up shutdowns
    drainTimeout: 60s
  telemetry:
    metrics:
      prometheus:
        compression:
          type: Zstd
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.networking.k8s.io/gatewayclass_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
  parametersRef:
    group: gateway.envoyproxy.io
    kind: EnvoyProxy
    name: envoy
    namespace: network
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-external
  annotations:
    external-dns.kubernetes.io/target: &hostname external.${ROOT_DOMAIN}
    gatus.home-operations.com/endpoint: |-
      client:
        dns-resolver: tcp://1.1.1.1:53
      group: external
  labels:
    app.kubernetes.io/name: envoy-external
spec:
  gatewayClassName: envoy
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: ${LB_EXTERNAL_IP}
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: external-tls
    - name: https-id
      protocol: HTTPS
      port: 443
      hostname: "id.${ROOT_DOMAIN}"
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              kubernetes.io/metadata.name: security
      tls:
        certificateRefs:
          - kind: Secret
            name: external-tls
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.networking.k8s.io/gateway_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: envoy-internal
  annotations:
    external-dns.kubernetes.io/target: &hostname internal.${ROOT_DOMAIN}
    gatus.home-operations.com/endpoint: |-
      group: internal
      guarded: true
      ui:
        hide-hostname: true
        hide-url: true
  labels:
    app.kubernetes.io/name: envoy-internal
spec:
  gatewayClassName: envoy
  allowedListeners:
    namespaces:
      from: Same
  infrastructure:
    annotations:
      external-dns.kubernetes.io/hostname: *hostname
      lbipam.cilium.io/ips: "${LB_INTERNAL_IP}"
  listeners:
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - kind: Secret
            name: internal-tls
    - name: syncthing
      protocol: TCP
      port: 22000
      allowedRoutes:
        namespaces:
          from: All
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: envoy
spec:
  compressor:
    - type: Zstd
      zstd: {}
    - type: Brotli
      brotli: {}
    - type: Gzip
      gzip: {}
  retry:
    numRetries: 2
    retryOn:
      triggers:
        - reset
  connection:
    bufferLimit: 8Mi
  healthCheck:
    panicThreshold: 0
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
  tcpKeepalive: {}
  timeout:
    http:
      requestTimeout: 0s
    tcp:
      connectTimeout: 5s
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-internal
spec:
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 172.30.0.0/16
  connection:
    bufferLimit: 8Mi
    maxAcceptPerSocketEvent: 0
  headers:
    lateResponseHeaders:
      add:
        - name: "Strict-Transport-Security"
          value: "max-age=31536000; includeSubDomains"
  http2:
    initialStreamWindowSize: 2Mi
    initialConnectionWindowSize: 32Mi
    onInvalidMessage: TerminateStream
  # LAN clients connect straight to the LoadBalancer, so QUIC works and there is
  # no PROXY header to parse. Enabling proxyProtocol here would make Envoy reject
  # the https-quic listener ("no registered implementation for
  # envoy.filters.listener.proxy_protocol"), which is not valid on UDP listeners.
  http3: {}
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-internal
  tcpKeepalive: {}
  timeout:
    http:
      requestReceivedTimeout: 0s
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.envoyproxy.io/clienttrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: ClientTrafficPolicy
metadata:
  name: envoy-external
spec:
  clientIPDetection:
    xForwardedFor:
      trustedCIDRs:
        - 172.30.0.0/16
  connection:
    bufferLimit: 8Mi
    maxAcceptPerSocketEvent: 0
  headers:
    lateResponseHeaders:
      add:
        - name: "Strict-Transport-Security"
          value: "max-age=31536000; includeSubDomains"
  http2:
    initialStreamWindowSize: 2Mi
    initialConnectionWindowSize: 32Mi
    onInvalidMessage: TerminateStream
  # Two paths reach this gateway:
  # - internet: traefik on mandark passes TLS through over the tailnet and
  #   prepends a PROXY v2 header carrying the real client address (the TCP
  #   source is the NAS subnet router, after SNAT);
  # - LAN: UniFi DNS resolves external-only hostnames straight to this LB IP,
  #   and those clients connect bare, without a PROXY header.
  # HTTP/3 is unreachable through traefik and must stay off — see the comment on
  # envoy-internal for why the two are exclusive.
  #
  # optional: true accepts both: the header is parsed when present and the TCP
  # peer is used otherwise. optional: false would drop every LAN connection
  # ("connection reset by peer"), so keep it true while the LAN path exists.
  proxyProtocol:
    optional: true
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: envoy-external
  tcpKeepalive: {}
  timeout:
    http:
      requestReceivedTimeout: 0s
  tls:
    minVersion: "1.2"
    alpnProtocols:
      - h2
      - http/1.1
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: https-redirect
  annotations:
    external-dns.kubernetes.io/controller: none
spec:
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: http
    - name: envoy-internal
      namespace: network
      sectionName: http
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.envoyproxy.io/envoyextensionpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyExtensionPolicy
metadata:
  name: eep
spec:
  targetSelectors:
    - group: gateway.networking.k8s.io
      kind: Gateway
      matchLabels:
        app.kubernetes.io/name: envoy-internal
  wasm:
    - name: eep
      rootID: eep
      code:
        type: Image
        image:
          url: oci://ghcr.io/ishioni/eep:0.4.0
      config:
        theme: app-down
        showDetails: true
        locale: auto
        logLevel: warn
      failOpen: false
