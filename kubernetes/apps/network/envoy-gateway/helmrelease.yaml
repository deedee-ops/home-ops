---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: envoy-gateway
spec:
  chartRef:
    kind: OCIRepository
    name: envoy-gateway
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - # Properly resolve DNS domains for cilium policies
            patch: |-
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
            target:
              kind: Deployment
              name: envoy-gateway
  values:
    global:
      imageRegistry: mirror.gcr.io
    certgen:
      job:
        pod:
          labels: &egress
            egress.cilium.io/kube-apiserver: "true"
    config:
      envoyGateway:
        extensionApis:
          enableBackend: true
        provider:
          type: Kubernetes
          kubernetes:
            deploy:
              type: GatewayNamespace
    deployment:
      pod:
        labels:
          <<: *egress
          app.kubernetes.io/managed-by: envoy-gateway
