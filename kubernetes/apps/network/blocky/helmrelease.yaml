---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
spec:
  chartRef:
    kind: OCIRepository
    name: blocky
  interval: 1h
  values:
    controllers:
      blocky:
        replicas: 3
        strategy: RollingUpdate
        # one pod per node (required anti-affinity), so there's no room to surge
        rollingUpdate:
          unavailable: 1
          surge: 0
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          labels:
            egress.cilium.io/internet: "true"
          # descheduler leaves system-critical pods alone (evictSystemCriticalPods: false)
          priorityClassName: system-cluster-critical
          affinity:
            podAntiAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
                - topologyKey: kubernetes.io/hostname
                  labelSelector:
                    matchLabels:
                      app.kubernetes.io/name: blocky
        containers:
          app:
            image:
              repository: ghcr.io/0xerr0r/blocky
              tag: v0.35.0@sha256:4f165b63db0d76c96ecc47c7a8f57caeedc003a912bdce29abb0e283ce02e16b
            env:
              BLOCKY_CONFIG_FILE: /app/config.yml
              # full HaGeZi TIF: ~360Mi steady, ~660Mi peak while refreshing lists
              GOMEMLIMIT: 900MiB
            probes:
              # queries healthcheck.blocky, answered from customDNS - never upstream
              liveness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: &healthcheck
                      - /app/blocky
                      - healthcheck
                      - --port=5353
                      - --bindip=127.0.0.1
                  periodSeconds: 10
                  timeoutSeconds: 3
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  exec:
                    command: *healthcheck
                  periodSeconds: 5
                  timeoutSeconds: 3
                  failureThreshold: 2
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 100
        seccompProfile:
          type: RuntimeDefault
    service:
      dns:
        controller: blocky
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 192.168.42.53
        # only nodes with a ready pod announce the VIP over BGP; keeps client IPs
        externalTrafficPolicy: Local
        ports:
          dns-tcp:
            port: 53
            targetPort: 5353
            protocol: TCP
          dns-udp:
            port: 53
            targetPort: 5353
            protocol: UDP
      metrics:
        controller: blocky
        primary: true
        ports:
          http:
            port: 4000
    serviceMonitor:
      blocky:
        service:
          identifier: metrics
        endpoints:
          - port: http
            path: /metrics
    persistence:
      config:
        type: configMap
        name: blocky-configmap
        globalMounts:
          - path: /app/config.yml
            subPath: config.yaml
            readOnly: true
