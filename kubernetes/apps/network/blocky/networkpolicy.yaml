---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: blocky-egress
specs:
  - endpointSelector:
      matchLabels:
        app.kubernetes.io/name: blocky
    egress:
      - toCIDRSet:
          - cidr: 192.168.42.1/32
        toPorts:
          - ports:
              - port: "53"
                protocol: ANY
