---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/blocky.config.json
ports:
  dns: 5353
  http: 4000

connectIPVersion: v4

upstreams:
  init:
    strategy: fast
  strategy: parallel_best
  timeout: 2s
  groups:
    default:
      - https://9.9.9.9/dns-query#dns.quad9.net
      - https://149.112.112.112/dns-query#dns.quad9.net
      - https://1.1.1.1/dns-query#cloudflare-dns.com
      - https://1.0.0.1/dns-query#cloudflare-dns.com

conditional:
  mapping:
    ${ROOT_DOMAIN}: 192.168.42.1
    internal: 192.168.42.1
    168.192.in-addr.arpa: 192.168.42.1
    ".": 192.168.42.1

clientLookup:
  upstream: 192.168.42.1
  singleNameOrder:
    - 1

customDNS:
  mapping:
    healthcheck.blocky: 127.0.0.1
    manuals.playstation.net: 192.168.42.30

blocking:
  denylists:
    ads:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/hagezi/pro.txt
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/majkiit/hostfile.txt
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/perflyst/SmartTV.txt
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/windowsspyblocker/spy.txt
    threats:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/hagezi/tif.txt
    private:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/custom/private.txt
    amazon:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/hagezi/native.amazon.txt
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/custom/amazon.txt
    samsung:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/custom/samsung.txt
    playstation:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/custom/playstation.txt
    bypass:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/denylists/hagezi/doh-vpn-proxy-bypass.txt
  allowlists:
    false-positives:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/allowlists/custom/false-positives.txt
    playstation:
      - http://dufs-dnslists.forgejo-system.svc.cluster.local/allowlists/custom/playstation.txt
  clientGroupsBlock:
    default:
      - ads
      - threats
      - private
      - false-positives
    192.168.3.0/24:
      - ads
      - threats
      - private
      - false-positives
      - amazon
      - samsung
      - playstation
      - bypass
    192.168.4.0/24:
      - ads
      - threats
      - private
      - false-positives
      - bypass
  blockType: zeroIp
  blockTTL: 1m
  loading:
    strategy: fast
    refreshPeriod: 4h
    downloads:
      timeout: 60s
      attempts: 5
      cooldown: 10s

caching:
  prefetching: true
  cacheTimeNegative: 5m

prometheus:
  enable: true
  path: /metrics

queryLog:
  type: none

log:
  level: info
  format: json
