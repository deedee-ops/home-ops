---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: smtp-relay
spec:
  secretName: smtp-relay-tls
  issuerRef:
    name: openbao
    kind: ClusterIssuer
  commonName: smtp-relay.network.svc.cluster.local
  dnsNames:
    - smtp-relay.network.svc.cluster.local
