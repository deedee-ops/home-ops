---
# yaml-language-server: $schema=https://schemas.ajgon.casa/secret-v1.json
apiVersion: v1
kind: Secret
metadata:
  name: flux-operator-web-secret
stringData:
  config.yaml: |-
    ---
    apiVersion: web.fluxcd.controlplane.io/v1
    kind: Config
    spec:
      authentication:
        oauth2:
          issuerURL: https://id.${ROOT_DOMAIN}
          provider: OIDC
          clientID: "${OAUTH_CLIENT_ID}"
          clientSecret: "${OAUTH_CLIENT_SECRET}"
        type: OAuth2
      baseURL: https://flux.${ROOT_DOMAIN}
