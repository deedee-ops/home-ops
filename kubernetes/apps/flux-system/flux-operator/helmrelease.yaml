---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/flux-operator-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    commonLabels:
      egress.cilium.io/kube-apiserver: "true"
      egress.cilium.io/auth: "true"
    commonAnnotations:
      glance/name: Flux Operator
      glance/icon: di:flux-cd
      glance/url: https://flux.${ROOT_DOMAIN}
    extraArgs:
      - "--web-config=/etc/flux-operator/web/config.yaml"
    extraVolumeMounts:
      - name: web-config
        mountPath: /etc/flux-operator/web
        readOnly: true
      - mountPath: /etc/ssl/certs/ca-certificates.crt
        name: homelab-root-ca
        subPath: ca.crt
        readOnly: true
    extraVolumes:
      - name: web-config
        configMap:
          name: flux-operator-web-configmap
      - name: homelab-root-ca
        configMap:
          name: homelab-root-ca
    resources:
      limits:
        cpu: 2000m
        memory: 1Gi
      requests:
        cpu: 100m
        memory: 64Mi
    securityContext:
      runAsNonRoot: true
      readOnlyRootFilesystem: true
      allowPrivilegeEscalation: false
      capabilities:
        drop:
          - "ALL"
      seccompProfile:
        type: "RuntimeDefault"
    serviceMonitor:
      create: true
    web:
      enabled: true
      httpRoute:
        enabled: true
        hostnames:
          - "flux.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
      networkPolicy:
        create: false
