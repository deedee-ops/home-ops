---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/pocket-id-operator-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pocket-id-operator
spec:
  chartRef:
    kind: OCIRepository
    name: pocket-id-operator
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - # Add security contexts
            patch: |-
              - op: add
                path: /spec/template/metadata/labels/egress.cilium.io~1kube-apiserver
                value: "true"
            target:
              kind: Deployment
              name: pocket-id-operator
  values:
    operator:
      autoGenerateLogos: false
      replicas: 2
      timezone: &tz Europe/Warsaw
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
      prometheusRule:
        enabled: true
      dashboard:
        enabled: true
        grafanaDashboard:
          enabled: true
          instanceSelector:
            matchLabels:
              grafana.internal/instance: grafana
    pocket-id-instance:
      instance:
        enabled: true
        name: pocket-id
        serviceMonitor:
          enabled: true
        spec:
          analyticsDisabled: true
          appUrl: &appUrl "https://id.${ROOT_DOMAIN}"
          annotations:
            glance/name: Pocket-ID
            glance/icon: di:pocket-id
            glance/url: *appUrl
          emailNotifications:
            loginNotification: true
            oneTimeAccessAsAdmin: true
            apiKeyExpiration: true
            oneTimeAccessAsUnauthenticated: false
            verification: true
          encryptionKey:
            valueFrom:
              secretKeyRef:
                name: pocket-id-operator-secret
                key: ENCRYPTION_KEY
          geoip:
            dbPath: /tmp/GeoLite2-City.mmdb
            maxmindLicenseKey:
              valueFrom:
                secretKeyRef:
                  name: pocket-id-operator-secret
                  key: MAXMIND_LICENSE_KEY
          image: ghcr.io/pocket-id/pocket-id:v2.14.0@sha256:01540977dcf4c7b41b1159f34d68e4632f2658d62790e460ca65a42722b13c4a
          labels:
            egress.cilium.io/smtp-relay: "true"
          logging:
            level: "info"
            json: true
          persistence:
            enabled: true
            existingClaim: pocket-id-operator
          podTemplate:
            spec:
              containers:
                - name: caddy
                  image: docker.io/library/caddy:2.11.4@sha256:df7f1c2fb114453b951de51a98efc010db1655a92c2e86be6706714e2417a78d
                  args:
                    - caddy
                    - run
                    - --config
                    - /config/Caddyfile
                  securityContext:
                    readOnlyRootFilesystem: true
                    allowPrivilegeEscalation: false
                    capabilities:
                      drop:
                        - ALL
                      add:
                        - NET_BIND_SERVICE
                  resources:
                    requests:
                      cpu: "5m"
                      memory: "128Mi"
                    limits:
                      cpu: "1000m"
                      memory: "512Mi"
                  volumeMounts:
                    - mountPath: /config/Caddyfile
                      name: pocket-id-caddy
                      subPath: Caddyfile
                    - mountPath: /config/caddy
                      name: tmp
                      subPath: caddy-config
                    - mountPath: /data/caddy
                      name: tmp
                      subPath: caddy-data
              volumes:
                - configMap:
                    name: pocket-id-caddy
                  name: pocket-id-caddy
                - emptyDir:
                    medium: Memory
                    sizeLimit: 32Mi
                  name: tmp
          route:
            enabled: true
            name: pocket-id
            parentRefs:
              - name: envoy-internal
                namespace: network
            template:
              rules:
                - filters:
                    - type: ResponseHeaderModifier
                      responseHeaderModifier:
                        set:
                          - name: Content-Security-Policy
                            value: >-
                              default-src 'self';
                              object-src 'none';
                              script-src 'self' 'unsafe-inline' 'unsafe-eval';
                              style-src 'self' 'unsafe-inline';
                    - cors:
                        allowOrigins:
                          - 'https://*.${ROOT_DOMAIN}'
                        allowHeaders:
                          - '*'
                        allowMethods:
                          - '*'
                      type: CORS
          rateLimitingDisabled: true # bootstrapping operator sends A LOT of requests
          smtp:
            host: smtp-relay.network.svc.cluster.local
            port: 25
            from: "deedee@${ROOT_DOMAIN}"
          timezone: *tz
          trustedProxies:
            enabled: true
          ui:
            sessionDuration: 10080 # 1 week
          userManagement:
            emailsVerified: true
            allowOwnAccountEdit: true
            allowUserSignups: "disabled"
          versionCheckDisabled: true
          webauthn:
            userVerification: preferred
      users:
        - name: ajgon
          spec:
            admin: true
            email:
              value: "ajgon@${ROOT_DOMAIN}"
            firstName:
              value: &firstName Igor
            lastName:
              value: &lastName Rzegocki
            customClaims:
              - key: firstName
                value: *firstName
              - key: lastName
                value: *lastName
      userGroups:
        - name: admins
          spec:
            friendlyName: admins
            users:
              userRefs:
                - name: ajgon
