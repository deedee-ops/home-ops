---
# yaml-language-server: $schema=https://schemas.ajgon.casa/gateway.networking.k8s.io/httproute_v1.json
# Public, backend-only slice of Pocket-ID for external relying parties (Tailscale).
# Login UI and WebAuthn stay internal; anything not listed here gets a 404.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pocket-id-external
  annotations:
    # Keep both external-dns instances off it: UniFi must keep pointing at
    # envoy-internal, the public record comes from dnsendpoint.yaml.
    external-dns.kubernetes.io/controller: none
spec:
  hostnames:
    - "id.${ROOT_DOMAIN}"
  parentRefs:
    - name: envoy-external
      namespace: network
      sectionName: https-id
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/openid-configuration
        - path:
            type: Exact
            value: /.well-known/jwks.json
        - path:
            type: Exact
            value: /api/oidc/token
        - path:
            type: Exact
            value: /api/oidc/userinfo
      backendRefs:
        - name: pocket-id
          port: 1411
