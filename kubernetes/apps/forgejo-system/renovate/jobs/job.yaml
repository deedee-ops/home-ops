---
# yaml-language-server: $schema=https://schemas.ajgon.casa/renovate-operator.mogenius.com/renovatejob_v1alpha1.json
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: forgejo
spec:
  discoveryFilters:
    - deedee/claude
    - deedee/mark13
    - deedee/schemas
  extraEnv:
    - name: GIT_SSL_CAINFO
      value: &certs /etc/ssl/certs/ca-certificates.crt
    - name: NODE_EXTRA_CA_CERTS
      value: *certs
    - name: RENOVATE_DETECT_HOST_RULES_FROM_ENV
      value: "true"
  extraVolumes:
    - name: homelab-root-ca
      configMap:
        name: homelab-root-ca
        defaultMode: 420
  extraVolumeMounts:
    - mountPath: /etc/ssl/certs/ca-certificates.crt
      name: homelab-root-ca
      subPath: ca.crt
      readOnly: true
  image: ghcr.io/renovatebot/renovate:44.199.2@sha256:0538f498be1b074e2434f8449cab7b2be30f8c0d0baf3b72814010f19db5bcfb
  metadata:
    labels:
      app.kubernetes.io/name: renovate-job
      egress.cilium.io/internet: "true"
  parallelism: 5
  provider:
    name: forgejo
    endpoint: https://git.${ROOT_DOMAIN}/api/v1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
  schedule: 0 * * * *
  secretRef: renovate-secret
  webhook:
    enabled: false
