---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: runner
spec:
  chartRef:
    kind: OCIRepository
    name: runner
  interval: 30m
  values:
    configMaps:
      config:
        suffix: config
        data:
          runner.yaml: |-
            cache:
              enabled: true
              dir: /data/cache
            container:
              docker_host: "-"
              workdir_parent: shared/workdir
            host:
              workdir_parent: /data/act
            log:
              level: info
            plugins:
              k8s:
                address: unix:///plugin/forgejo-runner-k8s.sock
                options:
                  namespace: forgejo-system
                  poll_timeout: 10m
                  labels: "app.kubernetes.io/name=runner-instance,app.kubernetes.io/instance=env-${ENV_ID},egress.cilium.io/kube-apiserver=true,egress.cilium.io/internet=true,egress.cilium.io/nas=true"
            runner:
              capacity: 4
              file: /persistent/.runner
              labels:
                - default:k8s:/config/podspec-default.yaml
                - nix:k8s:/config/podspec-nix.yaml
                - docker:k8s:/config/podspec-dind.yaml
              timeout: 3h
          podspec-default.yaml: |-
            containers:
              - env:
                  - name: DEBIAN_FRONTEND
                    value: noninteractive
                  - name: CURL_CA_BUNDLE
                    value: /etc/ssl/certs/ca-certificates.crt
                  - name: NODE_EXTRA_CA_CERTS
                    value: /etc/ssl/certs/ca-certificates.crt
                  - name: REQUESTS_CA_BUNDLE
                    value: /etc/ssl/certs/ca-certificates.crt
                  - name: SSL_CERT_FILE
                    value: /etc/ssl/certs/ca-certificates.crt
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
                imagePullPolicy: IfNotPresent
                name: main
                resources:
                  limits:
                    memory: 8Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
                volumeMounts:
                  - name: homelab-root-ca
                    mountPath: /etc/ssl/certs/ca-certificates.crt
                    subPath: ca.crt
                    readOnly: true
            restartPolicy: Never
            serviceAccount: forgejo-runner
            serviceAccountName: forgejo-runner
            volumes:
              - name: homelab-root-ca
                configMap:
                  name: homelab-root-ca
                  defaultMode: 420
          podspec-dind.yaml: |-
            initContainers:
              - name: dind
                image: docker:29-dind
                securityContext:
                  privileged: true
                restartPolicy: Always
                env:
                  - name: DOCKER_TLS_CERTDIR
                    value: /certs
                  - name: CURL_CA_BUNDLE
                    value: /etc/ssl/certs/ca-certificates.crt
                  - name: NODE_EXTRA_CA_CERTS
                    value: /etc/ssl/certs/ca-certificates.crt
                  - name: REQUESTS_CA_BUNDLE
                    value: /etc/ssl/certs/ca-certificates.crt
                  - name: SSL_CERT_FILE
                    value: /etc/ssl/certs/ca-certificates.crt
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 8Gi
                volumeMounts:
                  - name: docker-storage
                    mountPath: /var/lib/docker
                  - name: docker-certs
                    mountPath: /certs
                  - name: homelab-root-ca
                    mountPath: /etc/ssl/certs/ca-certificates.crt
                    subPath: ca.crt
                    readOnly: true
                startupProbe:
                  exec:
                    command:
                      - sh
                      - -c
                      - >-
                        docker --tlsverify --tlscacert=/certs/client/ca.pem --tlscert=/certs/client/cert.pem
                        --tlskey=/certs/client/key.pem -H tcp://localhost:2376 info
                  initialDelaySeconds: 5
                  periodSeconds: 1
                  failureThreshold: 30
            containers:
              - env:
                  - name: DEBIAN_FRONTEND
                    value: noninteractive
                  - name: DOCKER_HOST
                    value: tcp://localhost:2376
                  - name: DOCKER_TLS_VERIFY
                    value: "1"
                  - name: DOCKER_CERT_PATH
                    value: /certs/client
                image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04@sha256:8b7a25c7b3235c27e97df1cbb8411c1d12d2676e739265b5fbb66bb55f72dbf6
                imagePullPolicy: IfNotPresent
                name: main
                resources:
                  limits:
                    memory: 8Gi
                  requests:
                    cpu: 100m
                    memory: 256Mi
                volumeMounts:
                  - name: docker-certs
                    mountPath: /certs
                    readOnly: true
                  - name: homelab-root-ca
                    mountPath: /etc/ssl/certs/ca-certificates.crt
                    subPath: ca.crt
                    readOnly: true
            volumes:
              - name: docker-storage
                emptyDir: {}
              - name: docker-certs
                emptyDir: {}
              - name: homelab-root-ca
                configMap:
                  name: homelab-root-ca
                  defaultMode: 420
            restartPolicy: Never
            serviceAccount: forgejo-runner
            serviceAccountName: forgejo-runner
          podspec-nix.yaml: |-
            initContainers:
              - name: 01-nix-store
                image: nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
                command:
                  - sh
                  - -c
                  - |
                    if [ ! -d /data/store ]; then
                      cp -a /nix/. /data/
                    else
                      # /etc in the image symlinks into /nix/store, so seed paths missing after image bumps
                      cp -an /nix/store/. /data/store/
                    fi
                resources:
                  requests:
                    cpu: 100m
                    memory: 256Mi
                  limits:
                    memory: 1Gi
                volumeMounts:
                  - name: runner-nix-data
                    mountPath: /data
            containers:
              - image: nixos/nix:2.35.4@sha256:f159a58f390677f41e8e900a74b6e2f9c7f27b364122ae6acf7a652ce6c551c0
                imagePullPolicy: IfNotPresent
                name: main
                env:
                  - name: NIX_CONFIG
                    value: |-
                      max-jobs = 2
                      cores = 4
                resources:
                  limits:
                    memory: 24Gi
                  requests:
                    cpu: 100m
                    memory: 8Gi
                volumeMounts:
                  - name: runner-nix-data
                    mountPath: /nix
            volumes:
              - name: runner-nix-data
                persistentVolumeClaim:
                  claimName: runner-nix-data
            restartPolicy: Never
            serviceAccount: forgejo-runner
            serviceAccountName: forgejo-runner
    controllers:
      runner:
        type: deployment
        replicas: 1
        annotations:
          reloader.stakater.com/auto: "true"
        pod:
          automountServiceAccountToken: true
          labels:
            app.kubernetes.io/component: runner
            egress.cilium.io/internet: "true"
            egress.cilium.io/kube-apiserver: "true"
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
        containers:
          runner:
            image:
              repository: data.forgejo.org/forgejo/runner
              tag: 13.2.1@sha256:568cea8c15ddc01fc8f330124892f572af7db37fa28344a2c1914405793bf61d
            command:
              - sh
              - -ec
              - |
                exec /bin/forgejo-runner daemon \
                  --config /config/runner.yaml \
                  --url "http://forgejo-http:3000" \
                  --uuid "$(cat /etc/runner-secret/uuid)" \
                  --token-url file:///etc/runner-secret/token
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              capabilities:
                drop:
                  - ALL
              readOnlyRootFilesystem: true
          k8s-plugin:
            image:
              repository: registry.erwanleboucher.dev/erwanleboucher.dev/eleboucher/runner-k8s-plugin
              tag: 13.2.1@sha256:d62811841a20fd1a311b2c90c6ffcec37d09e52ebb46834b0c04f3ad2a3bcbe7
            args:
              - --listen
              - unix:///plugin/forgejo-runner-k8s.sock
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
    persistence:
      config:
        type: configMap
        identifier: config
        globalMounts:
          - path: /config
      plugin:
        type: emptyDir
        globalMounts:
          - path: /plugin
      tmpfs:
        type: emptyDir
        globalMounts:
          - path: /data
            subPath: data
          - path: /tmp
            subPath: tmp
      runner-secret:
        type: secret
        name: runner-secret
        globalMounts:
          - path: /etc/runner-secret
            readOnly: true
    rbac:
      bindings:
        runner:
          type: RoleBinding
          roleRef:
            identifier: runner
          subjects:
            - identifier: runner
      roles:
        runner:
          type: Role
          rules:
            # Jobs - the plugin creates jobs to run pipeline steps
            - apiGroups:
                - "batch"
              resources:
                - jobs
              verbs:
                - create
                - get
                - list
                - watch
                - delete
            # Pods - only needed when the plugin needs to interact with them (logs, exec)
            - apiGroups:
                - ""
              resources:
                - pods
              verbs:
                - list
                - watch
                - get
            - apiGroups:
                - ""
              resources:
                - pods/exec
              verbs:
                - create
                - get
            - apiGroups:
                - ""
              resources:
                - pods/log
              verbs:
                - list
                - watch
                - get
    serviceAccount:
      runner: {}
