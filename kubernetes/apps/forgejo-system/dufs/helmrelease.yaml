---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dufs
spec:
  chartRef:
    kind: OCIRepository
    name: dufs
  interval: 1h
  values:
    controllers:
      main:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: sigoden/dufs
              tag: v0.46.0@sha256:8dd3b750015734703e64b55641fb7d2254c112e0ff3967074766177dc15dc982
            env:
              TZ: Europe/Warsaw
              DUFS_CONFIG: /config/dufs.yaml
              DUFS_AUTH_METHOD: basic
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /__dufs__/health
                    port: &port 5000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness: *probe
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 256Mi
        statefulset:
          volumeClaimTemplates:
            - name: data
              storageClass: ceph-block
              accessMode: ReadWriteOnce
              size: 5Gi
              advancedMounts:
                app:
                  - path: /data
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 200"]
            url: "https://schemas.${EXTERNAL_ROOT_DOMAIN}/__dufs__/health"
        hostnames:
          - "schemas.${EXTERNAL_ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - matches:
              - method: GET
                path:
                  type: PathPrefix
                  value: /
              - method: HEAD
                path:
                  type: PathPrefix
                  value: /
            backendRefs:
              - name: dufs
                port: 80
    persistence:
      config-file:
        type: secret
        name: dufs-secret
        globalMounts:
          - path: /config/dufs.yaml
            subPath: dufs.yaml
            readOnly: true
