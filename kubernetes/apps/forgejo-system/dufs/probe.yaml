---
# yaml-language-server: $schema=https://schemas.ajgon.casa/monitoring.coreos.com/probe_v1.json
apiVersion: monitoring.coreos.com/v1
kind: Probe
metadata:
  name: dufs
spec:
  jobName: dufs
  interval: 1m
  scrapeTimeout: 15s
  module: https_external
  prober:
    url: blackbox-exporter-vpn.observability.svc.cluster.local:9115
  targets:
    staticConfig:
      static:
        - https://schemas.${ROOT_DOMAIN}/
  metricRelabelings:
    - targetLabel: service
      replacement: blackbox-exporter-external
      action: replace
