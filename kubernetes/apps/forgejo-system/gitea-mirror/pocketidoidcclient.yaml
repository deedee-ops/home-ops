---
# yaml-language-server: $schema=https://schemas.ajgon.casa/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: gitea-mirror
spec:
  pkceEnabled: true
  launchUrl: https://gitsync.${ROOT_DOMAIN}
  callbackUrls:
    - "https://gitsync.${ROOT_DOMAIN}/api/auth/sso/callback/pocket-id"
  allowedUserGroups:
    - name: admins
      namespace: security
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
