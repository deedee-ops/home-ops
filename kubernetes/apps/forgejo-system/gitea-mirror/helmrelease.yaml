---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: gitea-mirror
spec:
  chartRef:
    kind: OCIRepository
    name: gitea-mirror
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: Gitea Mirror
          glance/icon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/png/gitea-mirror.png
          glance/url: https://gitsync.${ROOT_DOMAIN}
        containers:
          app:
            image:
              repository: ghcr.io/raylabshq/gitea-mirror
              tag: v3.53.0@sha256:4c6c9a1c379060385ed1d0bc5dfd44108b8d4683c58c3b35597649b2b79e180e
            env:
              AUTH_DEFAULT_METHOD: sso
              AUTO_MIRROR_REPOS: "true"
              BETTER_AUTH_URL: https://gitsync.${ROOT_DOMAIN}
              CLEANUP_DRY_RUN: "true"
              DESTINATION_PROVIDER: forgejo
              GITEA_ADD_TOPICS: "true"
              GITEA_EXTERNAL_URL: https://git.${ROOT_DOMAIN}
              GITEA_ORG_VISIBILITY: private
              GITEA_URL: http://forgejo-http:3000
              INCLUDE_COLLABORATOR_REPOS: "false"
              INCLUDE_ORGANIZATIONS: dummy
              MIRROR_RELEASES: "true"
              MIRROR_STARRED: "false"
              NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt
              ONLY_MIRROR_ORGS: "true"
              PORT: &port 4321
              PRIVATE_REPOSITORIES: "false"
              PUBLIC_BETTER_AUTH_URL: https://gitsync.${ROOT_DOMAIN}
              SCHEDULE_AUTO_RETRY: "true"
              SCHEDULE_ENABLED: "true"
              SCHEDULE_NOTIFY_ON_FAILURE: "true"
              SCHEDULE_SKIP_RECENTLY_MIRRORED: "true"
              SCHEDULE_TIMEZONE: &tz Europe/Warsaw
              SKIP_FORKS: "false"
              TZ: *tz
            envFrom:
              - secretRef:
                  name: gitea-mirror-secret
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 50m
                memory: 256Mi
              limits:
                memory: 8Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/auth: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "gitsync.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: gitea-mirror
                port: *port
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Content-Security-Policy
                      value: >-
                        default-src 'self';
                        font-src 'self' data:;
                        img-src 'self' data: https:;
                        object-src 'none';
                        script-src 'self' 'unsafe-inline';
                        style-src 'self' 'unsafe-inline';
    persistence:
      data:
        existingClaim: gitea-mirror
        globalMounts:
          - path: /app/data
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        globalMounts:
          - path: /etc/ssl/certs/ca-certificates.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
