---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dnslists
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: dnslists-secret
    template:
      data:
        dufs.yaml: |
          serve-path: /data
          port: 5000
          allow-upload: true
          allow-delete: true
          render-index: true
          auth:
            - 'ci:{{ .DNSLISTS_PASSWORD }}@/:rw'
            - '@/'
  dataFrom:
    - extract:
        key: kubernetes/forgejo-system/dufs
