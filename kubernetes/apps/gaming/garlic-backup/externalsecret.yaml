---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garlic-backup
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: garlic-backup-secret
    template:
      data:
        ftpserver.json: |-
          {
            "version": 1,
            "listen_address": "0.0.0.0:2121",
            "passive_transfer_port_range": {
              "start": 2122,
              "end": 2130
            },
            "extensions": {
              "enable_hash": true
            },
            "accesses": [
              {
                "user": "retro",
                "pass": {{ .GARLIC_BACKUP_PASSWORD | toJson }},
                "fs": "os",
                "params": {
                  "basePath": "/data"
                }
              }
            ]
          }
  dataFrom:
    - extract:
        key: kubernetes/gaming/garlic-backup
