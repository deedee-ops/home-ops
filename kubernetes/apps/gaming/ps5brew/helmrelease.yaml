---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps5brew
spec:
  chartRef:
    kind: OCIRepository
    name: ps5brew
  interval: 1h
  values:
    controllers:
      main:
        strategy: Recreate
        containers:
          app:
            image:
              repository: registry.ajgon.casa/tools/ps5brew
              tag: latest@sha256:8707b3661f66d454426aff5b6b85d31fc9c53e2c4a391c00a3bdcd0bc89c0fb3
            args:
              - "--payloads.name=ps5brew.${ROOT_DOMAIN}"
            env:
              PS5BREW_SERVER__PORT: &port 8080
              PS5BREW_SERVER__URL: https://ps5brew.${ROOT_DOMAIN}
              PS5BREW_STORE__CATALOGS: https://homebrew.page/api/v1/
              PS5BREW_STORAGE__DATA: /data
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /livez
                    port: *port
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
          # ps3netsrv-go:
          #   image:
          #     repository: ghcr.io/xakep666/ps3netsrv-go
          #     tag: v0.3.0@sha256:c60069a5a10d79a3d2df4d2ecd1fae63c5c7f4e212f73c2a765ffa4bcca0a4fc
          #   env:
          #     TZ: Europe/Warsaw
          #   probes:
          #     liveness: &ps3netsrvGoProbe
          #       enabled: true
          #       custom: true
          #       spec:
          #         tcpSocket:
          #           port: 38008
          #         periodSeconds: 30
          #         timeoutSeconds: 5
          #         failureThreshold: 3
          #     readiness: *ps3netsrvGoProbe
          #   securityContext:
          #     allowPrivilegeEscalation: false
          #     readOnlyRootFilesystem: true
          #     capabilities:
          #       drop:
          #         - ALL
          #   resources:
          #     requests:
          #       cpu: 10m
          #     limits:
          #       memory: 128Mi
          ps3netsrv:
            image:
              repository: shawly/ps3netsrv
              tag: v2.0.1@sha256:8697bc0e00eecc44f70a349b8ff8a2ccd6db6abd71da1d682bb29bf85ec5e07a
            command:
              - /usr/bin/ps3netsrv-mbedtls
            args:
              - /games
              - "38008"
            env:
              TZ: Europe/Warsaw
            probes:
              liveness: &ps3netsrvProbe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/ps3netsrv-healthcheck
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *ps3netsrvProbe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/ps3netsrv-healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        primary: true
        ports:
          http:
            port: *port
      ps3netsrv:
        controller: main
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "ps3netsrv.${ROOT_DOMAIN}"
          lbipam.cilium.io/ips: 192.168.42.37
        externalTrafficPolicy: Cluster
        ports:
          ps3netsrv:
            port: 38008
    serviceMonitor:
      app:
        service:
          identifier: app
        endpoints:
          - port: http
            scheme: http
            path: /metrics
            interval: 1m
            scrapeTimeout: 10s
    route:
      app:
        hostnames:
          - "ps5brew.${ROOT_DOMAIN}"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: ps5brew
            namespace: network
            sectionName: https-ps5brew
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            matches:
              - path:
                  type: PathPrefix
                  value: /
      manuals:
        hostnames:
          - "manuals.playstation.net"
        parentRefs:
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: ps5brew
            namespace: network
            sectionName: https-manuals-playstation
          - group: gateway.networking.k8s.io
            kind: ListenerSet
            name: ps5brew
            namespace: network
            sectionName: http-manuals-playstation
        rules:
          - backendRefs:
              - identifier: app
                port: *port
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Strict-Transport-Security
                      value: max-age=0
            matches:
              - path:
                  type: PathPrefix
                  value: /
    persistence:
      data:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: nas-k8s.internal
              share: "/mnt/tank/retro/ps5brew"
              mountOptions: "noac,nfsvers=4.1,nconnect=16,hard,noatime"
        advancedMounts:
          main:
            app:
              - path: /data
      # tmp:
      #   type: emptyDir
      #   advancedMounts:
      #     main:
      #       ps3netsrv-go:
      #         - path: /tmp
      roms:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: nas-k8s.internal
              share: "/mnt/tank/retro/romm/library/mappings"
              mountOptions: "noac,nfsvers=4.1,nconnect=16,hard,noatime"
        advancedMounts:
          main:
            # ps3netsrv-go:
            #   - path: /srv/ps3data/PS3ISO
            #     subPath: ps3iso
            #     readOnly: true
            ps3netsrv:
              - path: /games/PS3ISO
                subPath: ps3iso
                readOnly: true
