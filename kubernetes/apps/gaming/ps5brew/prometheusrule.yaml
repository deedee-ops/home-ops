---
# yaml-language-server: $schema=https://schemas.ajgon.casa/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: ps5brew-rules
spec:
  groups:
    - name: ps5brew.rules
      rules:
        - alert: PS5BrewCatalogSchemaDiverged
          expr: |-
            max by (source) (ps5brew_catalog_schema_diverged) > 0
          for: 5m
          annotations:
            summary: >-
              The {{ $labels.source }} catalog uses a schema newer than ps5brew supports;
              nothing from it is stored until ps5brew is updated.
          labels:
            severity: warning
        - alert: PS5BrewDropInConflict
          expr: |-
            max by (kind) (ps5brew_dropins_conflicts) > 0
          for: 5m
          annotations:
            summary: >-
              {{ $value }} ps5brew {{ $labels.kind }} drop-in(s) clash with a catalog entry;
              the drop-ins are served and the catalog versions ignored.
          labels:
            severity: warning
