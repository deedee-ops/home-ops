---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ps3netsrv
spec:
  chartRef:
    kind: OCIRepository
    name: ps3netsrv
  interval: 1h
  values:
    controllers:
      main:
        containers:
          # ps3netsrv-go:
          #   image:
          #     repository: ghcr.io/xakep666/ps3netsrv-go
          #     tag: v0.3.0@sha256:c60069a5a10d79a3d2df4d2ecd1fae63c5c7f4e212f73c2a765ffa4bcca0a4fc
          #   env:
          #     TZ: Europe/Warsaw
          #   probes:
          #     liveness: &ps3netsrvGoProbe
          #       enabled: true
          #       custom: true
          #       spec:
          #         tcpSocket:
          #           port: 38008
          #         periodSeconds: 30
          #         timeoutSeconds: 5
          #         failureThreshold: 3
          #     readiness: *ps3netsrvGoProbe
          #   securityContext:
          #     allowPrivilegeEscalation: false
          #     readOnlyRootFilesystem: true
          #     capabilities:
          #       drop:
          #         - ALL
          #   resources:
          #     requests:
          #       cpu: 10m
          #     limits:
          #       memory: 128Mi
          app:
            image:
              repository: shawly/ps3netsrv
              tag: v2.0.1@sha256:8697bc0e00eecc44f70a349b8ff8a2ccd6db6abd71da1d682bb29bf85ec5e07a
            command:
              - /usr/bin/ps3netsrv-mbedtls
            args:
              - /games
              - "38008"
            env:
              TZ: Europe/Warsaw
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/ps3netsrv-healthcheck
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  exec:
                    command:
                      - /usr/local/bin/ps3netsrv-healthcheck
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "ps3netsrv.${ROOT_DOMAIN}"
          lbipam.cilium.io/ips: 192.168.42.37
        externalTrafficPolicy: Cluster
        ports:
          ps3netsrv:
            port: 38008
    persistence:
      # tmp:
      #   type: emptyDir
      #   advancedMounts:
      #     main:
      #       ps3netsrv-go:
      #         - path: /tmp
      roms:
        type: custom
        volumeSpec:
          csi:
            driver: nfs.csi.k8s.io
            volumeAttributes:
              server: nas-k8s.internal
              share: "/mnt/tank/retro/romm/library/mappings"
              mountOptions: "noac,nfsvers=4.1,nconnect=16,hard,noatime"
        advancedMounts:
          main:
            # ps3netsrv-go:
            #   - path: /srv/ps3data/PS3ISO
            #     subPath: ps3iso
            #     readOnly: true
            app:
              - path: /games/PS3ISO
                subPath: ps3iso
                readOnly: true
