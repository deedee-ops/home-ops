---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blackbox-exporter-lan
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: blackbox-exporter-lan-secret
    template:
      data:
        UNIFI_API_KEY: "{{ .UNIFI_API_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/observability/blackbox-exporter
