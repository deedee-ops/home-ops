---
# yaml-language-server: $schema=https://schemas.ajgon.casa/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  chartRef:
    kind: OCIRepository
    name: loki
  interval: 1h
  values:
    fullnameOverride: loki
    deploymentMode: Monolithic
    defaults:
      automountServiceAccountToken: false
      enableServiceLinks: false
    serviceAccount:
      automountServiceAccountToken: false
    rbac:
      namespaced: true

    loki:
      image:
        repository: grafana/loki
        tag: 3.7.9@sha256:0db216b630ae1f348a1584c67f3cead8b4c1fc839169a39501db664744158e28
      auth_enabled: false
      analytics:
        reporting_enabled: false
      commonConfig:
        replication_factor: 1
        ring:
          kvstore:
            store: inmemory
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2026-11-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: index_
              period: 24h
      ingester:
        chunk_encoding: zstd
        wal:
          flush_on_shutdown: true
      compactor:
        retention_enabled: true
        delete_request_store: filesystem
      limits_config:
        retention_period: 30d
        reject_old_samples: true
        reject_old_samples_max_age: 168h
        max_cache_freshness_per_query: 10m
        split_queries_by_interval: 15m
        query_timeout: 300s
        volume_enabled: true
        allow_structured_metadata: true
        discover_log_levels: true
      pattern_ingester:
        enabled: false
      server:
        log_level: info

    singleBinary:
      replicas: 1
      podDisruptionBudget:
        enabled: false
      persistence:
        enabled: true
        size: 20Gi
        storageClass: ceph-block
      resources:
        requests:
          cpu: 50m
          memory: 256Mi
        limits:
          memory: 1Gi

    gateway:
      enabled: true
      replicas: 1
      verboseLogging: false
      metrics:
        enabled: false
      image:
        repository: nginx/nginx-unprivileged
        tag: 1.31-alpine@sha256:0ec17b0dac55776357d46d882bed7f3d504b0e4a0bc7379c7dbb74bd12b9d4da
      podDisruptionBudget:
        enabled: false
      resources:
        requests:
          cpu: 5m
          memory: 16Mi
        limits:
          memory: 64Mi
      nginxConfig:
        # read-only: Loki also serves admin actions (/flush, /ingester/shutdown) on GET
        file: |
          worker_processes 1;
          error_log /dev/stderr;
          pid /tmp/nginx.pid;
          events {
            worker_connections 1024;
          }
          http {
            client_body_temp_path /tmp/client_temp;
            proxy_temp_path /tmp/proxy_temp_path;
            fastcgi_temp_path /tmp/fastcgi_temp;
            uwsgi_temp_path /tmp/uwsgi_temp;
            scgi_temp_path /tmp/scgi_temp;
            client_max_body_size 0;
            proxy_read_timeout 300;
            proxy_http_version 1.1;
            default_type application/octet-stream;
            log_format main '$remote_addr [$time_local] $status "$request" $body_bytes_sent';
            map $status $loggable {
              ~^[23] 0;
              default 1;
            }
            access_log /dev/stderr main if=$loggable;
            server_tokens off;
            map $uri $loki_read {
              default 0;
              ~^/loki/api/v1/(query|query_range|labels|series|patterns|detected_fields|detected_labels)$ 1;
              ~^/loki/api/v1/(label|detected_field)/[^/]+/values$ 1;
              ~^/loki/api/v1/index/(stats|volume|volume_range)$ 1;
              ~^/loki/api/v1/status/buildinfo$ 1;
            }
            upstream loki {
              server loki.{{ .Release.Namespace }}.svc.cluster.local:3100;
            }
            server {
              listen 8080;
              location = / {
                return 200 'OK';
              }
              location /loki/api/v1/ {
                if ($loki_read = 0) {
                  return 403;
                }
                limit_except GET {
                  deny all;
                }
                proxy_set_header Connection "";
                proxy_pass http://loki$uri$is_args$args;
              }
              location / {
                return 403;
              }
            }
          }

    memcached:
      enabled: false
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    lokiCanary:
      enabled: false
    test:
      enabled: false
    ruler:
      enabled: false
    sidecar:
      rules:
        enabled: false

    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: false
      rules:
        enabled: false

    backend:
      replicas: 0
    read:
      replicas: 0
    write:
      replicas: 0
