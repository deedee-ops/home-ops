---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-adapter
spec:
  chartRef:
    kind: OCIRepository
    name: prometheus-adapter
  interval: 1h
  values:
    logLevel: 1
    replicas: 2
    podLabels:
      egress.cilium.io/kube-apiserver: "true"
    prometheus:
      url: http://prometheus-operated
      port: 9090
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 128Mi
    rules:
      default: false
      external:
        - seriesQuery: '{__name__="scale:gate"}'
          resources:
            namespaced: false
          name:
            matches: "^scale:gate$"
            as: scale-gate
          metricsQuery: min(<<.Series>>{<<.LabelMatchers>>})

        - seriesQuery: '{__name__="scale:gate"}'
          resources:
            namespaced: false
          name:
            matches: "^scale:gate$"
            as: scale-gate-x3
          metricsQuery: min(<<.Series>>{<<.LabelMatchers>>}) * 3
