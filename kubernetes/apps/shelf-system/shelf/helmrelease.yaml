---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: shelf
spec:
  chartRef:
    kind: OCIRepository
    name: shelf
  interval: 1h
  values:
    controllers:
      webapp:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: Shelf
          glance/icon: https://raw.githubusercontent.com/Shelf-nu/shelf.nu/refs/heads/main/apps/webapp/public/static/images/shelf-logo-x512.png
          glance/url: https://shelf.${ROOT_DOMAIN}
        initContainers:
          01-db-migrate:
            image: &shelfImg
              repository: ghcr.io/shelf-nu/shelf.nu
              tag: latest@sha256:ebb82ad8d120042a173c851c90d75c2fad95d74f9f87fc891c6605ad0ddace46
            command:
              - /bin/sh
              - -c
            # yamllint disable rule:line-length
            args:
              - |
                export DATABASE_URL="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/shelf"
                export DIRECT_URL="$${DATABASE_URL}"
                exec npx --yes prisma@6.19.3 migrate deploy \
                  --schema /src/packages/database/prisma/schema.prisma
            # yamllint enable rule:line-length
            env:
              <<: &pgEnv
                POSTGRES_HOST:
                  secretKeyRef:
                    name: shelf-db-app
                    key: host
                POSTGRES_PORT:
                  secretKeyRef:
                    name: shelf-db-app
                    key: port
                POSTGRES_USER:
                  secretKeyRef:
                    name: shelf-db-app
                    key: username
                POSTGRES_PASSWORD:
                  secretKeyRef:
                    name: shelf-db-app
                    key: password
              CHECKPOINT_DISABLE: "1"
              HOME: /tmp
              NPM_CONFIG_CACHE: /tmp/.npm
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
        containers:
          app:
            image: *shelfImg
            command:
              - /bin/sh
              - -c
            # yamllint disable rule:line-length
            args:
              - |
                export DATABASE_URL="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/shelf"
                export DIRECT_URL="$${DATABASE_URL}"
                exec /src/apps/webapp/docker-entrypoint.sh
            # yamllint enable rule:line-length
            env:
              <<: *pgEnv
              CHECKPOINT_DISABLE: "1"
              COLLECT_BUSINESS_INTEL: "false"
              DEFAULT_SSO_DOMAIN: &ssoDomain ${ROOT_DOMAIN}
              DISABLE_SIGNUP: "false"
              DISABLE_SSO: "false"
              ENABLE_PREMIUM_FEATURES: "false"
              NODE_EXTRA_CA_CERTS: /etc/ssl/certs/ca-certificates.crt # has to be via ENV, or it falls back to builtins
              PORT: &webPort 8080
              SERVER_URL: https://shelf.${ROOT_DOMAIN}
              SMTP_FROM: &smtpFrom "deedee@${ROOT_DOMAIN}"
              SMTP_HOST: &smtpHost "smtp-relay.network.svc.cluster.local"
              SMTP_PORT: &smtpPort "25"
              SMTP_PWD: ""
              SMTP_USER: ""
              SUPABASE_URL: &supabaseUrl https://shelf-supabase.${ROOT_DOMAIN}
              URL_SHORTENER: "i.${ROOT_DOMAIN}"
              SESSION_SECRET:
                secretKeyRef:
                  name: shelf-secret
                  key: SESSION_SECRET
              INVITE_TOKEN_SECRET:
                secretKeyRef:
                  name: shelf-secret
                  key: INVITE_TOKEN_SECRET
              MAPTILER_TOKEN:
                secretKeyRef:
                  name: shelf-secret
                  key: MAPTILER_TOKEN
              SUPABASE_ANON_PUBLIC: &anonKey
                secretKeyRef:
                  name: shelf-secret
                  key: ANON_KEY
              SUPABASE_SERVICE_ROLE: &serviceKey
                secretKeyRef:
                  name: shelf-secret
                  key: SERVICE_ROLE_KEY
            probes:
              liveness: &webProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthcheck
                    port: *webPort
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness: *webProbe
            securityContext: *sc
            resources:
              requests:
                cpu: 25m
                memory: 384Mi
              limits:
                memory: 1Gi
      gotrue:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/supabase/gotrue
              tag: v2.197.0@sha256:1736a63078f5922b198c4cbe50f80ab9a2d3b54fe8b7b6cfb2e9dc5dbbc12c6b
            command:
              - /bin/sh
              - -c
            # yamllint disable rule:line-length
            args:
              - |
                export GOTRUE_DB_DATABASE_URL="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/shelf?search_path=auth"
                exec auth
            # yamllint enable rule:line-length
            env:
              <<: *pgEnv
              API_EXTERNAL_URL: *supabaseUrl
              GOTRUE_API_HOST: 0.0.0.0
              GOTRUE_CORS_ALLOWED_HEADERS: "*"
              GOTRUE_DB_DRIVER: postgres
              GOTRUE_DB_NAMESPACE: auth
              GOTRUE_DISABLE_SIGNUP: "false"
              GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
              GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
              GOTRUE_JWT_ADMIN_ROLES: service_role
              GOTRUE_JWT_AUD: authenticated
              GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
              GOTRUE_JWT_EXP: "3600"
              GOTRUE_MAILER_AUTOCONFIRM: "true"
              GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: http://shelf-templates.shelf-system.svc.cluster.local:8080/templates/mail-magic-link.html
              GOTRUE_MAILER_TEMPLATES_RECOVERY: http://shelf-templates.shelf-system.svc.cluster.local:8080/templates/mail-recovery.html
              GOTRUE_SAML_ENABLED: "true"
              GOTRUE_SAML_EXTERNAL_URL: https://shelf-supabase.${ROOT_DOMAIN}/auth/v1
              GOTRUE_SITE_URL: https://shelf.${ROOT_DOMAIN}
              GOTRUE_SMTP_ADMIN_EMAIL: *smtpFrom
              GOTRUE_SMTP_HOST: *smtpHost
              GOTRUE_SMTP_MAX_FREQUENCY: "5s"
              GOTRUE_SMTP_PORT: *smtpPort
              GOTRUE_URI_ALLOW_LIST: "https://shelf.${ROOT_DOMAIN}/**"
              PORT: &authPort 9999
              GOTRUE_SAML_PRIVATE_KEY:
                secretKeyRef:
                  name: shelf-secret
                  key: GOTRUE_SAML_PRIVATE_KEY
              GOTRUE_JWT_SECRET: &jwtSecret
                secretKeyRef:
                  name: shelf-secret
                  key: JWT_SECRET
            probes:
              liveness: &authProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *authPort
                  initialDelaySeconds: 10
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness: *authProbe
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi

      storage-api:
        containers:
          app:
            image:
              repository: ghcr.io/supabase/storage-api
              tag: v1.84.23@sha256:7112e91307968d3eceffb5228291202d7bac8015a27af25d4b5a4b0543eadf22
            command:
              - /bin/sh
              - -c
            # yamllint disable rule:line-length
            args:
              - |
                export DATABASE_URL="postgres://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@$${POSTGRES_HOST}:$${POSTGRES_PORT}/shelf"
                exec node dist/start/server.js
            # yamllint enable rule:line-length
            env:
              <<: *pgEnv
              ANON_KEY: *anonKey
              AUTH_JWT_SECRET: *jwtSecret
              DB_INSTALL_ROLES: "false"
              ENABLE_IMAGE_TRANSFORMATION: "false"
              FILE_SIZE_LIMIT: "52428800" # 50 MiB
              FILE_STORAGE_BACKEND_PATH: /var/lib/storage
              PGRST_JWT_SECRET: *jwtSecret
              POSTGREST_URL: ""
              REGION: home
              SERVER_PORT: &storagePort 5000
              SERVICE_KEY: *serviceKey
              STORAGE_BACKEND: file
              STORAGE_S3_BUCKET: shelf
              TENANT_ID: shelf
            probes:
              liveness: &storageProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: *storagePort
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness: *storageProbe
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi

      sso:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          01-metadata:
            image: &satosaImg
              repository: docker.io/library/satosa
              tag: 8.6.0@sha256:40342057550915198c0d806bc476c3045eae752c91eed09c3e138d8320afb18b
            command:
              - /bin/sh
              - -c
            args:
              - |
                mkdir -p /tmp/metadata
                exec satosa-saml-metadata /etc/satosa/conf/proxy_conf.yaml --dir /tmp/metadata --no-sign
            env: &satosaEnv
              REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
              SATOSA_CONFIG: /etc/satosa/conf/proxy_conf.yaml
              SATOSA_OIDC_CLIENT_ID:
                secretKeyRef:
                  name: shelf-oidc-credentials
                  key: OAUTH_CLIENT_ID
              SATOSA_OIDC_CLIENT_SECRET:
                secretKeyRef:
                  name: shelf-oidc-credentials
                  key: OAUTH_CLIENT_SECRET
              SATOSA_STATE_ENCRYPTION_KEY:
                secretKeyRef:
                  name: shelf-secret
                  key: SATOSA_STATE_ENCRYPTION_KEY
            securityContext: *sc
          02-register-provider:
            image: *satosaImg
            command:
              - python
              - -I
              - /etc/satosa/conf/register-sso-provider.py
            env:
              GOTRUE_URL: http://shelf-gotrue.shelf-system.svc.cluster.local:9999
              METADATA_FILE: /tmp/metadata/frontend.xml
              SERVICE_ROLE_KEY: *serviceKey
              SSO_DOMAIN: *ssoDomain
            securityContext: *sc
        containers:
          app:
            image: *satosaImg
            # bypass docker-entrypoint.sh: it generates sample configs into /etc/satosa
            command:
              - gunicorn
              - --bind=0.0.0.0:8080
              - --worker-tmp-dir=/tmp
              - satosa.wsgi:app
            env: *satosaEnv
            probes:
              liveness: &ssoProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: &ssoPort 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness: *ssoProbe
            securityContext: *sc
            resources:
              requests:
                cpu: 10m
                memory: 96Mi
              limits:
                memory: 256Mi

      templates:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/library/caddy
              tag: 2.11.7@sha256:504a44d7d74bd2bc28a66afc4774912fc21223ca8a67734af1c54ab2f999b489
            command:
              - caddy
              - run
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
            env:
              XDG_DATA_HOME: /tmp
              XDG_CONFIG_HOME: /tmp
            probes:
              liveness: &templatesProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &templatesPort 8080
                  initialDelaySeconds: 5
                  periodSeconds: 10
                  timeoutSeconds: 2
                  failureThreshold: 6
              readiness: *templatesProbe
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
                add:
                  - NET_BIND_SERVICE
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 64Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/auth: "true"
        egress.cilium.io/smtp-relay: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      webapp:
        controller: webapp
        ports:
          http:
            port: *webPort
      gotrue:
        controller: gotrue
        ports:
          http:
            port: *authPort
      storage-api:
        controller: storage-api
        ports:
          http:
            port: *storagePort
      sso:
        controller: sso
        ports:
          http:
            port: *ssoPort
      templates:
        controller: templates
        ports:
          http:
            port: *templatesPort
    route:
      app: &appRoute
        hostnames:
          - "shelf.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: shelf-webapp
                port: *webPort
      inventory:
        <<: *appRoute
        hostnames:
          - "i.${ROOT_DOMAIN}"
        annotations:
          gatus.home-operations.com/enabled: "false"
      sso:
        hostnames:
          - "shelf-sso.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: shelf-sso
                port: *ssoPort
      supabase:
        hostnames:
          - "shelf-supabase.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /auth/v1
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - name: shelf-gotrue
                port: *authPort
          - matches:
              - path:
                  type: PathPrefix
                  value: /verify
            backendRefs:
              - name: shelf-gotrue
                port: *authPort
          - matches:
              - path:
                  type: PathPrefix
                  value: /storage/v1
            filters:
              - type: URLRewrite
                urlRewrite:
                  path:
                    type: ReplacePrefixMatch
                    replacePrefixMatch: /
            backendRefs:
              - name: shelf-storage-api
                port: *storagePort
    persistence:
      storage:
        existingClaim: shelf
        advancedMounts:
          storage-api:
            app:
              - path: /var/lib/storage
      caddyfile:
        type: configMap
        name: shelf-templates-configmap
        advancedMounts:
          templates:
            app:
              - subPath: Caddyfile
                path: /etc/caddy/Caddyfile
              - subPath: mail-magic-link.html
                path: /etc/caddy/templates/mail-magic-link.html
              - subPath: mail-recovery.html
                path: /etc/caddy/templates/mail-recovery.html
      sso-config:
        type: configMap
        name: shelf-sso-configmap
        advancedMounts:
          sso:
            app: &ssoConfigMount
              - path: /etc/satosa/conf
                readOnly: true
            01-metadata: *ssoConfigMount
            02-register-provider: *ssoConfigMount
      sso-keys:
        type: secret
        name: shelf-secret
        defaultMode: 0440
        items:
          - key: idp.crt
            path: idp.crt
          - key: idp.key
            path: idp.key
        advancedMounts:
          sso:
            app: &ssoKeysMount
              - path: /etc/satosa/keys
                readOnly: true
            01-metadata: *ssoKeysMount
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        globalMounts:
          - path: /etc/ssl/certs/ca-certificates.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
        advancedMounts:
          webapp:
            app: &tmpMount
              - path: /tmp
            01-db-migrate: *tmpMount
          gotrue:
            app: *tmpMount
          storage-api:
            app: *tmpMount
          sso:
            app: *tmpMount
            01-metadata: *tmpMount
            02-register-provider: *tmpMount
          templates:
            app: *tmpMount
