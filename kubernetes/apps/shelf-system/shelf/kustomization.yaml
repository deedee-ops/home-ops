---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./database.yaml
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./pocketidoidcclient.yaml
configMapGenerator:
  - name: shelf-templates-configmap
    files:
      - ./resources/Caddyfile
      - ./resources/mail-magic-link.html
      - ./resources/mail-recovery.html
  - name: shelf-sso-configmap
    files:
      - ./resources/sso/backend.yaml
      - ./resources/sso/frontend.yaml
      - ./resources/sso/internal_attributes.yaml
      - ./resources/sso/ping.yaml
      - ./resources/sso/proxy_conf.yaml
      - ./resources/sso/register-sso-provider.py
      - ./resources/sso/sp-gotrue.xml
generatorOptions:
  disableNameSuffixHash: true
