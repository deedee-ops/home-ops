---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/cert-manager-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  postRenderers:
    - kustomize:
        patches:
          - # Properly resolve DNS domains for cilium policies
            patch: |-
              - op: add
                path: /spec/template/spec/dnsConfig
                value:
                  options:
                    - name: ndots
                      value: "1"
            target:
              kind: Deployment
              name: cert-manager
  values:
    cainjector:
      podLabels: &egress
        egress.cilium.io/kube-apiserver: "true"
    podLabels:
      <<: *egress
      egress.cilium.io/nas: "true"
    crds:
      enabled: true
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    startupapicheck:
      podLabels: &egress
        egress.cilium.io/kube-apiserver: "true"
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
      podLabels: *egress
