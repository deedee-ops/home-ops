---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/cert-manager-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cert-manager
spec:
  chartRef:
    kind: OCIRepository
    name: cert-manager
  interval: 1h
  values:
    cainjector:
      podLabels: &egress
        egress.cilium.io/kube-apiserver: "true"
    podLabels:
      <<: *egress
      egress.cilium.io/nas: "true"
    crds:
      enabled: true
    # UniFi answers ${ROOT_DOMAIN} locally without SOA/NS, so the DNS-01 self-check
    # never finds Cloudflare's nameservers. Resolve challenges like the outside world.
    extraArgs:
      - --dns01-recursive-nameservers-only
      - --dns01-recursive-nameservers=1.1.1.1:53,9.9.9.9:53
    prometheus:
      enabled: true
      servicemonitor:
        enabled: true
    startupapicheck:
      podLabels: &egress
        egress.cilium.io/kube-apiserver: "true"
    webhook:
      replicaCount: 2
      podDisruptionBudget:
        enabled: true
      podLabels: *egress
