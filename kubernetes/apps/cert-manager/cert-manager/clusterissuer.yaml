---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: openbao
spec:
  vault:
    path: pki_int/sign/ajgon-casa
    server: https://${VAULT_HOST}
    caBundle: ${CA_BUNDLE}
    auth:
      tokenSecretRef:
        name: clusterissuer-secret
        key: token
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cert-manager.io/clusterissuer_v1.json
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-production
spec:
  acme:
    profile: shortlived
    privateKeySecretRef:
      name: letsencrypt-production
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: clusterissuer-secret
              key: CLOUDFLARE_DNS_TOKEN
        selector:
          dnsZones:
            - "${EXTERNAL_ROOT_DOMAIN}"
