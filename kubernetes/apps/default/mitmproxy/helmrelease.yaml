---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mitmproxy
spec:
  chartRef:
    kind: OCIRepository
    name: mitmproxy
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/mitmproxy/mitmproxy
              tag: 12.3.0@sha256:c8a3753de11fd8266afeb103e163f7b7ac6a4a568a707fa2e15b23d20acf4eba
            command:
              - mitmweb
            args:
              - --mode
              - reverse:http://127.0.0.1:9@8080
              - --emudhra
              - --scripts
              - /addons/passthrough.py
              - --set
              - confdir=/config
              - --set
              - connection_strategy=lazy
              - --set
              - keep_host_header=true
              - --set
              - onboarding=false
              - --set
              - stream_large_bodies=10m
              - --set
              - web_host=0.0.0.0
              - --set
              - web_port=8081
              - --set
              - web_open_browser=false
            env:
              HOME: /config
              TZ: Europe/Warsaw
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                spec:
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/internet: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        primary: true
        ports:
          web:
            port: &webPort 8081
      proxy:
        controller: main
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: "proxy.${ROOT_DOMAIN}"
          lbipam.cilium.io/ips: 192.168.42.69
        externalTrafficPolicy: Cluster
        ports:
          http:
            primary: true
            port: 80
            targetPort: &proxyPort 8080
          https:
            port: 443
            targetPort: *proxyPort
    route:
      app:
        hostnames:
          - "mitm.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: app
                port: *webPort
    persistence:
      addons:
        type: configMap
        name: mitmproxy-configmap
        globalMounts:
          - path: /addons
            readOnly: true
      config:
        type: emptyDir
