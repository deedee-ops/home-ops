---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wealthfolio
spec:
  chartRef:
    kind: OCIRepository
    name: wealthfolio
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: Wealthfolio
          glance/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/wealthfolio.png
          glance/url: https://wealthfolio.${ROOT_DOMAIN}
        containers:
          app:
            image:
              repository: docker.io/wealthfolio/wealthfolio
              tag: 3.12.0@sha256:5790528fcd9795b571176cad78bcca09e3fa5875ec20968356586939e154c3cb
            env:
              TZ: Europe/Warsaw
              WF_LISTEN_ADDR: "0.0.0.0:8088"
              WF_DB_PATH: /data/wealthfolio.db
              WF_CORS_ALLOW_ORIGINS: "https://wealthfolio.${ROOT_DOMAIN}"
              WF_COOKIE_SECURE: "true"
              WF_OIDC_ISSUER_URL: "https://id.${ROOT_DOMAIN}"
              WF_OIDC_REDIRECT_URL: "https://wealthfolio.${ROOT_DOMAIN}/api/v1/auth/oidc/callback"
              WF_OIDC_ALLOWED_EMAILS: "ajgon@${ROOT_DOMAIN}"
              WF_OIDC_CA_FILE: /etc/ssl/certs/ca-certificates.crt
              WF_MCP_ENABLED: "true"
              WF_MCP_AUDIT_ENABLED: "true"
              WF_MCP_ALLOWED_HOSTS: "wealthfolio.${ROOT_DOMAIN}"
            envFrom:
              - secretRef:
                  name: wealthfolio-secret
              - secretRef:
                  name: wealthfolio-oidc-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthz
                    port: &port 8088
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/ai: "true"
        egress.cilium.io/auth: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        hostnames:
          - "wealthfolio.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: wealthfolio
                port: 80
    persistence:
      data:
        existingClaim: wealthfolio
        globalMounts:
          - path: /data
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        globalMounts:
          - path: /etc/ssl/certs/ca-certificates.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
