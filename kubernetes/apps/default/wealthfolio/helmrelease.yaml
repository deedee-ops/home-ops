---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: wealthfolio
spec:
  chartRef:
    kind: OCIRepository
    name: wealthfolio
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: Wealthfolio
          glance/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/png/wealthfolio.png
          glance/url: https://wealthfolio.${ROOT_DOMAIN}
        containers:
          app:
            image:
              repository: docker.io/wealthfolio/wealthfolio
              tag: 3.13.0@sha256:6600feaa06910a35854bc07a4cdf943a29b4a7a443190912e3d3c02288533ed2
            env:
              TZ: Europe/Warsaw
              WF_LISTEN_ADDR: "0.0.0.0:8088"
              WF_DB_PATH: /data/wealthfolio.db
              WF_CORS_ALLOW_ORIGINS: "https://wealthfolio.${ROOT_DOMAIN}"
              WF_COOKIE_SECURE: "true"
              WF_OIDC_ISSUER_URL: "https://id.${ROOT_DOMAIN}"
              WF_OIDC_REDIRECT_URL: "https://wealthfolio.${ROOT_DOMAIN}/api/v1/auth/oidc/callback"
              WF_OIDC_ALLOWED_EMAILS: "ajgon@${ROOT_DOMAIN}"
              WF_OIDC_CA_FILE: /etc/ssl/certs/ca-certificates.crt
              WF_MCP_ENABLED: "true"
              WF_MCP_AUDIT_ENABLED: "true"
              WF_MCP_ALLOWED_HOSTS: "wealthfolio.${ROOT_DOMAIN}"
            envFrom:
              - secretRef:
                  name: wealthfolio-secret
              - secretRef:
                  name: wealthfolio-oidc-credentials
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/healthz
                    port: &port 8088
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/readyz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext: &sc
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
          pricer:
            image:
              repository: registry.ajgon.casa/tools/wealthfolio-sidecar
              tag: latest@sha256:925fb51b2e7a1eceda0eefa050734c389d2976f94eee2327c512dcb3d1a2d470
            env:
              TZ: Europe/Warsaw
              WF_MCP_URL: http://127.0.0.1:8088/mcp
              WF_MCP_HOST: "wealthfolio.${ROOT_DOMAIN}"
            envFrom:
              - secretRef:
                  name: wealthfolio-sidecar-secret
                  optional: true
            securityContext: *sc
            resources:
              requests:
                cpu: 5m
                memory: 32Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/ai: "true"
        egress.cilium.io/auth: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
          metrics:
            port: 8090
    serviceMonitor:
      app:
        endpoints:
          - port: metrics
    route:
      app:
        hostnames:
          - "wealthfolio.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: wealthfolio
                port: 80
    persistence:
      data:
        existingClaim: wealthfolio
        advancedMounts:
          main:
            app:
              - path: /data
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        advancedMounts:
          main:
            app:
              - path: /etc/ssl/certs/ca-certificates.crt
                subPath: ca.crt
                readOnly: true
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
