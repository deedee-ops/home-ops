---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wealthfolio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: wealthfolio-secret
    template:
      data:
        WF_SECRET_KEY: "{{ .WF_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/default/wealthfolio
