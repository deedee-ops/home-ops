---
# yaml-language-server: $schema=https://schemas.ajgon.casa/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: wealthfolio
spec:
  pkceEnabled: true
  launchUrl: https://wealthfolio.${ROOT_DOMAIN}
  callbackUrls:
    - "https://wealthfolio.${ROOT_DOMAIN}/api/v1/auth/oidc/callback"
  secret:
    additionalLabels:
      reconcile.fluxcd.io/watch: Enabled
    keys:
      clientID: WF_OIDC_CLIENT_ID
      clientSecret: WF_OIDC_CLIENT_SECRET
