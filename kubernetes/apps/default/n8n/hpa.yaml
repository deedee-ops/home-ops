---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/horizontalpodautoscaler-autoscaling-v2.json
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: &name n8n
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: *name
  minReplicas: 0
  maxReplicas: 1
  metrics:
    - type: External
      external:
        metric:
          name: scale-gate
          selector:
            matchExpressions:
              - key: gate
                operator: In
                values:
                  - volume-fast
                  - volume-tank
        target:
          type: AverageValue
          averageValue: "1"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 0
      policies:
        - type: Percent
          value: 100
          periodSeconds: 15
