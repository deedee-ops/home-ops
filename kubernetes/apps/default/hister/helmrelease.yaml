---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hister
spec:
  chartRef:
    kind: OCIRepository
    name: hister
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          reloader.stakater.com/auto: "true"
          glance/name: Hister
          glance/icon: di:hister
          glance/url: &url https://hister.${ROOT_DOMAIN}
        containers:
          app:
            image:
              repository: ghcr.io/asciimoo/hister
              tag: v0.19.0@sha256:dae5ae63f292bf6075c7c60cfef031e15d809a19b09db34d9e54306aab490e9b
            env:
              HISTER_DATA_DIR: /config/data
              HISTER__APP__DIRECTORY: /config/app
              HISTER__APP__REDIRECT_ON_NO_RESULTS: true
              HISTER__APP__SEARCH_URL: "https://search.${ROOT_DOMAIN}/search?q={query}"
              HISTER__SEMANTIC_SEARCH__DIMENSIONS: 1024
              HISTER__SEMANTIC_SEARCH__EMBEDDING_ENDPOINT: http://embedder.ai.svc.cluster.local/v1/embeddings
              HISTER__SEMANTIC_SEARCH__EMBEDDING_MODEL: mixedbread-ai/mxbai-embed-large-v1
              HISTER__SEMANTIC_SEARCH__ENABLE: true
              HISTER__SERVER__ADDRESS: 0.0.0.0:4433
              HISTER__SERVER__BASE_URL: *url
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "hister-secret"
            probes:
              liveness:
                enabled: true
                spec:
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 4433
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/smtp-relay: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: 80
            targetPort: *port
    route:
      app:
        hostnames:
          - "hister.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: hister
                port: 80
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Content-Security-Policy
                      value: >-
                        default-src 'self' data: blob:;
                        img-src 'self' data: blob: https:;
                        object-src 'none';
                        script-src 'self' 'unsafe-inline' 'unsafe-eval';
                        style-src 'self' 'unsafe-inline';
    persistence:
      config:
        existingClaim: hister
      tmp:
        type: emptyDir
        globalMounts:
          - subPath: tmp
            path: /tmp
