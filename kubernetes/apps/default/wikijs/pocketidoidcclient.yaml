---
# yaml-language-server: $schema=https://schemas.ajgon.casa/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: wikijs
spec:
  pkceEnabled: true
  launchUrl: https://wiki.${ROOT_DOMAIN}
  callbackUrls:
    - "https://wiki.${ROOT_DOMAIN}/_api/auth/*/callback"
  logoutCallbackUrls:
    - "https://wiki.${ROOT_DOMAIN}"
  secret:
    additionalLabels:
      reconcile.fluxcd.io/watch: Enabled
    keys:
      clientID: OAUTH_CLIENT_ID
      clientSecret: OAUTH_CLIENT_SECRET
