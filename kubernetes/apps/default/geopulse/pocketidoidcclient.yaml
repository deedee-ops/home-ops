---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: geopulse
spec:
  launchUrl: https://geopulse.${ROOT_DOMAIN}
  callbackUrls:
    - "https://geopulse.${ROOT_DOMAIN}/oidc/callback"
  secret:
    additionalLabels:
      reconcile.fluxcd.io/watch: Enabled
    keys:
      clientID: GEOPULSE_OIDC_PROVIDER_GENERIC_CLIENT_ID
      clientSecret: GEOPULSE_OIDC_PROVIDER_GENERIC_CLIENT_SECRET
