---
# yaml-language-server: $schema=https://schemas.ajgon.casa/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: geopulse-egress-external
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: geopulse
  egress:
    - toFQDNs:
        - matchName: api.open-meteo.com
        - matchName: archive-api.open-meteo.com
        - matchName: download.geonames.org
        - matchName: query.wikidata.org
        - matchPattern: "*.openstreetmap.org"
        - matchPattern: "*.wikimedia.org"
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/component: database
