---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geopulse
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: geopulse-secret
    template:
      data:
        ai-encryption-key.txt: "{{ .AI_ENCRYPTION_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/default/geopulse
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: geopulse-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: geopulse-db-secret
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: geopulse
        password: "{{ .password }}"
        host: default-db-rw
        port: "5432"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: default-db-password
