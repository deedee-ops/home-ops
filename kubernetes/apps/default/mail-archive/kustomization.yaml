---
# yaml-language-server: $schema=https://www.schemastore.org/kustomization.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
  - ./pocketidoidcclient.yaml
  - ./pvc.yaml
  - ./secret.yaml
configMapGenerator:
  - name: mail-archive-configmap
    files:
      - ./resources/dovecot.conf
      - ./resources/imapsync.sh
generatorOptions:
  disableNameSuffixHash: true
