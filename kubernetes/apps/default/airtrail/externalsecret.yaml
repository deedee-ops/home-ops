---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airtrail
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: airtrail-secret
    template:
      data:
        INTEGRATIONS_AERO_DATA_BOX_KEY: "{{ .INTEGRATIONS_AERO_DATA_BOX_KEY }}"
        INTEGRATIONS_OPEN_AIP_KEY: "{{ .INTEGRATIONS_OPEN_AIP_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/default/airtrail
