---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airtrail
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: openbao
  target:
    name: airtrail-secret
    template:
      data:
        INTEGRATIONS_AERO_DATA_BOX_KEY: "{{ .INTEGRATIONS_AERO_DATA_BOX_KEY }}"
        INTEGRATIONS_OPEN_AIP_KEY: "{{ .INTEGRATIONS_OPEN_AIP_KEY }}"
  dataFrom:
    - extract:
        key: kubernetes/default/airtrail
---
# yaml-language-server: $schema=https://schemas.ajgon.casa/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: airtrail-db
spec:
  refreshPolicy: CreatedOnce
  target:
    name: airtrail-db-secret
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      data:
        username: airtrail
        password: "{{ .password }}"
        host: default-db-rw
        port: "5432"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: default-db-password
