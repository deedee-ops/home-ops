---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: airtrail
spec:
  pkceEnabled: true
  launchUrl: https://airtrail.${ROOT_DOMAIN}
  callbackUrls:
    - "https://airtrail.${ROOT_DOMAIN}/login"
  secret:
    additionalLabels:
      reconcile.fluxcd.io/watch: Enabled
    keys:
      clientID: OAUTH_CLIENT_ID
      clientSecret: OAUTH_CLIENT_SECRET
