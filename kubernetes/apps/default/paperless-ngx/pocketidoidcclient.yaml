---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: paperless-ngx
spec:
  launchUrl: https://paperless.${ROOT_DOMAIN}
  callbackUrls:
    - "https://paperless.${ROOT_DOMAIN}/accounts/oidc/pocket-id/login/callback/"
  secret:
    additionalLabels:
      reconcile.fluxcd.io/watch: Enabled
    keys:
      clientID: OAUTH_CLIENT_ID
      clientSecret: OAUTH_CLIENT_SECRET
---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: paperless-gpt
spec:
  launchUrl: https://paperless-gpt.${ROOT_DOMAIN}
  callbackUrls:
    - "https://paperless-gpt.${ROOT_DOMAIN}/oauth2/callback"
  allowedUserGroups:
    - name: admins
      namespace: security
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
