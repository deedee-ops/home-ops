---
# yaml-language-server: $schema=https://schemas.ajgon.casa/pocketid.internal/pocketidoidcclient_v1alpha1.json
apiVersion: pocketid.internal/v1alpha1
kind: PocketIDOIDCClient
metadata:
  name: subtrackr
spec:
  pkceEnabled: true
  launchUrl: https://subtrackr.${ROOT_DOMAIN}
  callbackUrls:
    - "https://subtrackr.${ROOT_DOMAIN}/auth/oidc/callback"
  allowedUserGroups:
    - name: admins
      namespace: security
  secret:
    keys:
      clientID: client-id
      clientSecret: client-secret
