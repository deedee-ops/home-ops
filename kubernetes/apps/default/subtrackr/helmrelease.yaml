---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/app-template-hr.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: subtrackr
spec:
  chartRef:
    kind: OCIRepository
    name: subtrackr
  interval: 1h
  values:
    controllers:
      main:
        annotations:
          glance/name: SubTrackr
          glance/icon: https://cdn.jsdelivr.net/gh/selfhst/icons/svg/subtrackr.svg
          glance/url: https://subtrackr.${ROOT_DOMAIN}
        containers:
          app:
            image:
              repository: ghcr.io/bscott/subtrackr
              tag: 0.7.0@sha256:92ad6c586f21f44807f0cd33808aca16fbff1df2ebd94c83e7744a2e5e70003e
            env:
              DATABASE_PATH: /app/data/subtrackr.db
              GIN_MODE: release
              PORT: &port 8080
              TZ: Europe/Warsaw
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
              startup:
                enabled: true
                spec:
                  failureThreshold: 30
                  periodSeconds: 10
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                  - ALL
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: false
      enableServiceLinks: false
      labels:
        egress.cilium.io/auth: "true"
        egress.cilium.io/smtp-relay: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        hostnames:
          - "subtrackr.${ROOT_DOMAIN}"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - name: subtrackr
                port: *port
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  set:
                    - name: Content-Security-Policy
                      value: >-
                        default-src 'self';
                        object-src 'none';
                        script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com;
                        style-src 'self' 'unsafe-inline';
                        img-src 'self' data: https://www.google.com https://*.gstatic.com;
    persistence:
      data:
        existingClaim: subtrackr
        globalMounts:
          - path: /app/data
      homelab-root-ca:
        type: configMap
        name: homelab-root-ca
        globalMounts:
          - path: /etc/ssl/certs/ca-certificates.crt
            subPath: ca.crt
            readOnly: true
      tmp:
        type: emptyDir
