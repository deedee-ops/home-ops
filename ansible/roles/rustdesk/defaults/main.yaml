---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/ansible-vars.json
# Contents of id_ed25519 / id_ed25519.pub generated by hbbs. Clients pin the public key
# (hbbs runs with `-k _`), so losing the pair means reconfiguring every client.
rustdesk_private_key: ""
rustdesk_public_key: ""

# Must match the rustdesk stack's volume: ${DATA_DOCKER_DIR}/rustdesk.
rustdesk_data_dir: "{{ docker_compose_env.DATA_DOCKER_DIR }}/rustdesk"

# The container runs as this uid/gid (`user:` in docker/rustdesk/compose.yaml).
rustdesk_uid: 1000
rustdesk_gid: 1000
