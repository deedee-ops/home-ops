---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/ansible.json#/$defs/tasks
- name: Configure the Docker package repository
  ansible.builtin.include_tasks: "repository/{{ ansible_facts['os_family'] }}.yaml"

- name: Install Docker Engine with compose and buildx plugins
  ansible.builtin.package:
    name: "{{ docker_packages }}"
    state: present

- name: Create Docker configuration directory
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: docker_daemon_config | length > 0

- name: Render Docker daemon configuration
  ansible.builtin.copy:
    content: "{{ docker_daemon_config | to_nice_json }}\n"
    dest: /etc/docker/daemon.json
    owner: root
    group: root
    mode: "0644"
    validate: dockerd --validate --config-file %s
  when: docker_daemon_config | length > 0
  notify: Restart docker

- name: Add users to the docker group
  ansible.builtin.user:
    name: "{{ item }}"
    groups: docker
    append: true
  loop: "{{ docker_users }}"

- name: Manage the docker service
  ansible.builtin.systemd_service:
    name: docker
    enabled: "{{ docker_service_enabled }}"
    state: "{{ docker_service_state }}"

- name: Schedule daily pruning of stopped containers and unused images
  ansible.builtin.cron:
    name: docker-prune
    cron_file: docker-prune
    user: root
    hour: "{{ docker_prune_hour }}"
    minute: "{{ docker_prune_minute }}"
    job: >-
      /usr/bin/docker container prune --force >/dev/null &&
      /usr/bin/docker image prune --all --force >/dev/null
    state: "{{ 'present' if docker_prune_enabled else 'absent' }}"

- name: Deploy the compose stacks
  ansible.builtin.include_tasks: init-containers.yaml
  when: docker_compose_stacks | length > 0
