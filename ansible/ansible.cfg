[defaults]
inventory = ./inventory
roles_path = ./roles
vault_password_file = ./vault-pass.sh
interpreter_python = auto_silent
; the 2.24 default, opted into early: facts are read as ansible_facts['name'] only,
; so a stray top-level ansible_* fact fails loudly instead of warning
inject_facts_as_vars = false
host_key_checking = true
force_handlers = true
display_skipped_hosts = false
retry_files_enabled = false

[privilege_escalation]
become = true
become_method = sudo

[ssh_connection]
pipelining = true
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
