---
# zot: private registry (push/pull), successor of docker/registry
distSpecVersion: 1.1.1
http:
  address: 0.0.0.0
  port: "5000"
  # accept docker v2 schema2 manifests as-is (default is OCI-only)
  compat:
    - docker2s2
  externalUrl: https://zot.ajgon.casa
  realm: zot
  auth:
    failDelay: 5
    # API keys for CLI/CI (`docker login` with OIDC user + key), created in the UI
    apikey: true
    # written by zot-secrets init container
    sessionKeysFile: /secret/session-keys.json
    openid:
      providers:
        # callback: https://zot.ajgon.casa/zot/auth/callback/oidc
        oidc:
          name: Pocket ID
          issuer: https://id.ajgon.casa
          credentialsFile: /secret/oidc.json
          scopes:
            - openid
            - profile
            - email
            - groups
          claimMapping:
            username: preferred_username
            groups: groups
  accessControl:
    repositories:
      "**":
        # cluster and NAS pull without credentials
        anonymousPolicy:
          - read
        defaultPolicy:
          - read
        policies:
          - groups:
              - admins
            actions:
              - read
              - create
              - update
              - delete
log:
  level: info
storage:
  # local dir only holds boltdb (dedupe cache + metadb), blobs live in S3
  rootDirectory: /var/lib/registry
  dedupe: true
  remoteCache: false
  storageDriver:
    name: s3
    bucket: zot
    rootdirectory: /registry
    region: eu-central-1
    regionendpoint: http://garage:3900
    forcepathstyle: true
    secure: false
    v4auth: true
    # credentials: AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY from env
  gc: true
  # grace period for blobs of in-flight uploads
  gcDelay: 1h
  gcInterval: 24h
  retention:
    dryRun: false
    # untagged manifests older than this are removed
    delay: 24h
    policies:
      - repositories:
          - "**"
        deleteReferrers: true
        deleteUntagged: true
        # no keepTags: tags are never removed automatically
extensions:
  search:
    enable: true
  ui:
    enable: true
