---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  cameras:
    environment:
      VTH_IP: vth.internal
    image: registry.ajgon.casa/home/cameras:latest@sha256:29395956b60879307325fac8dbb260e4b24f71e4df3cdd8ed605c753c4d78ab4
    container_name: cameras
    restart: unless-stopped
    ports:
      - "5101:5101"
      - "5104:5104"
      - "5105:5105"
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true
