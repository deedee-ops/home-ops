---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  ncps-secret:
    image: alpine:3.24@sha256:71e9b7bae160ba167fa17414401b94cbcdaf3c32feeab9298bd794a2a0614c35
    container_name: ncps-secret
    user: 1000:1000
    restart: "no"
    environment:
      NCPS_CACHE_SECRET_KEY: "${NCPS_CACHE_SECRET_KEY}"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        : "$${NCPS_CACHE_SECRET_KEY:?refusing to write an empty signing key}"
        printf '%s' "$$NCPS_CACHE_SECRET_KEY" > /secret/key
    volumes:
      - ${DATA_DOCKER_DIR}/ncps/secret:/secret
    networks:
      - internal
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true

  ncps-init:
    image: ghcr.io/kalbasit/ncps:v0.10.1@sha256:75fe26ea14bc35d336eca877a2e94a768d30631f415198242bbf1e5203f26a47
    container_name: ncps-init
    user: 1000:1000
    restart: "no"
    # SQLITE_TMPDIR and the temp mount are load-bearing, do not drop them. goose
    # migrations can rewrite whole tables (CREATE new_x / INSERT..SELECT / DROP /
    # RENAME / CREATE UNIQUE INDEX), and the index sorters need scratch space.
    # ncps links the cgo mattn/go-sqlite3 driver, i.e. real SQLite, which looks for
    # temp space in SQLITE_TMPDIR, then TMPDIR, then /var/tmp, /usr/tmp, /tmp --
    # every one of them read-only here because of `read_only: true`. Without this,
    # such a migration dies with `disk I/O error: permission denied`. Disk-backed
    # rather than a RAM tmpfs: a table rewrite can spill a lot and this container
    # has no memory limit.
    environment:
      SQLITE_TMPDIR: /var/tmp/ncps
    command:
      - /bin/ncps
      - migrate
      - up
      - --cache-database-url=sqlite:/var/lib/ncps/db.sqlite
    volumes:
      - ${DATA_DOCKER_DIR}/ncps/db:/var/lib/ncps
      - ${DATA_DOCKER_DIR}/ncps/tmp:/var/tmp/ncps
    networks:
      - internal
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true

  ncps:
    depends_on:
      ncps-init:
        condition: service_completed_successfully
      ncps-secret:
        condition: service_completed_successfully
    image: ghcr.io/kalbasit/ncps:v0.10.1@sha256:75fe26ea14bc35d336eca877a2e94a768d30631f415198242bbf1e5203f26a47
    container_name: ncps
    user: 1000:1000
    restart: unless-stopped
    environment:
      CACHE_STORAGE_S3_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID}"
      CACHE_STORAGE_S3_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY}"
      # Written by the ncps-secret service above, mounted read-only below.
      CACHE_SECRET_KEY_PATH: /secret/key
      SSL_CERT_FILE: /etc/ssl/certs/ca-certificates.crt
      # Defaults to true and ships DB type, lock type and total cache size to
      # otlp.ncps.dev. Set via env because it is a *root* flag, not a `serve` one,
      # so as an argument it would have to precede the subcommand.
      ANALYTICS_REPORTING_ENABLED: "false"
    command:
      - /bin/ncps
      - serve
      - --cache-hostname=nix.${ROOT_DOMAIN}
      - --cache-database-url=sqlite:/var/lib/ncps/db.sqlite
      # NARs are streamed through a temp dir on the way to S3. Kept on disk rather
      # than the tmpfs below so a large closure cannot balloon into RAM.
      - --cache-temp-path=/var/tmp/ncps
      # storage: garage, reached in-cluster to skip a TLS hop through traefik.
      # path-style is mandatory for garage.
      - --cache-storage-s3-bucket=nix
      - --cache-storage-s3-endpoint=http://garage:3900
      - --cache-storage-s3-region=eu-central-1
      - --cache-storage-s3-force-path-style
      # Accept `nix copy --to https://nix.${ROOT_DOMAIN}/upload` for our own builds.
      # This is a bare on/off switch with no authentication, and uploads are
      # re-signed with our key, which every client trusts -- so it must stay
      # unreachable from outside the LAN.
      #
      # v0.10 does add --cache-require-trusted-signature (+ --cache-trusted-upload-key),
      # which would reject unsigned uploads. Not enabled because it would break
      # nixlab's cache.sh: locally-built paths carry no signature unless the pushing
      # machines set `secret-key-files`, so turning it on means changing CI and every
      # dev host at the same time.
      - --cache-allow-put-verb
      # Pull-through upstreams. Public keys are passed as one flat list; ncps binds
      # each to an upstream by matching ^<url-host>-[0-9]+:<base64>$, so ordering
      # here is irrelevant. An upstream with no matching key is proxied WITHOUT
      # signature verification and without warning, so every entry needs its key.
      #
      # The cachix caches name NAR objects with opaque UUIDs
      # (`URL: nar/e6a13bb6-...-713dfa0a8e68.nar.zst`), which needs the opaque-URL
      # support added in kalbasit/ncps#1331 -- verified working on v0.10. Note
      # pkg/nar/hash.go's NormalizedHashPattern still only matches real hashes, so
      # grepping it gives a false negative: do not conclude cachix is unsupported
      # and drop these upstreams. On anything older than v0.10 they must come out
      # of here and go into nixlab/flake.nix as extra-substituters instead.
      - --cache-upstream-url=https://cache.nixos.org
      - --cache-upstream-url=https://nix-community.cachix.org
      - --cache-upstream-url=https://deploy-rs.cachix.org
      - --cache-upstream-url=https://noctalia.cachix.org
      - --cache-upstream-url=https://vicinae.cachix.org
      - --cache-upstream-public-key=cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
      - --cache-upstream-public-key=nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=
      - --cache-upstream-public-key=deploy-rs.cachix.org-1:xfNobmiwF/vzvK1gpfediPwpdIP0rpDV2rYqx40zdSI=
      - --cache-upstream-public-key=noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4=
      - --cache-upstream-public-key=vicinae.cachix.org-1:1kDrfienkGHPYbkpNj1mWTr7Fm1+zcenzgTizIcI3oc=
      # NOTE: eviction stays off on v0.10 too, because closure pinning is broken:
      # GetPinnedClosureHashes walks References with `narInfoHashLength = 52` while
      # narinfo hashes are 32 chars and references are `<32-hash>-<name>-<version>`
      # basenames, so no reference ever resolves and a pin protects only the exact
      # narinfo pinned -- a size cap would still evict the whole closure.
      # --cache-lru-schedule / --cache-max-size are deliberately unset. The
      # LRU cron job is only registered when a schedule is given, so nothing is
      # ever evicted and the mirror stays complete for offline use.
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ${DATA_DOCKER_DIR}/ncps/db:/var/lib/ncps
      - ${DATA_DOCKER_DIR}/ncps/tmp:/var/tmp/ncps
      - ${DATA_DOCKER_DIR}/ncps/secret:/secret:ro
    tmpfs:
      - /tmp:mode=1777,uid=1000,gid=1000
    networks:
      - internal
    labels:
      traefik.enable: "true"
      traefik.http.services.ncps.loadbalancer.server.port: "8501"
      traefik.http.routers.ncps.entrypoints: https
      traefik.http.routers.ncps.rule: Host(`nix.${ROOT_DOMAIN}`)
      traefik.http.routers.ncps.service: ncps
      traefik.http.routers.ncps.tls: "true"
      traefik.http.routers.ncps.tls.certresolver: openbao-ecdsa
      traefik.http.routers.ncps.tls.domains[0].main: "nix.${ROOT_DOMAIN}"
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true

networks:
  internal:
    name: internal
    external: true
