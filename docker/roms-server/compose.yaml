---
# yaml-language-server: $schema=https://schemas.rzegocki.dev/other/docker-compose.json
services:
  roms-server:
    environment:
      ROMS_CONFIG: /roms-server.yaml
      ROMS_SERVER_EXTERNAL_URL: "http://${NAS_IP}:4444"
    image: registry.ajgon.casa/tools/roms-server:latest
    container_name: roms-server
    restart: unless-stopped
    user: 1000:1000
    configs:
      - source: config
        target: /roms-server.yaml
    # tank is encrypted: refuse to start (instead of creating empty
    # dirs on the locked pool) until it is unlocked
    volumes:
      - type: bind
        source: /mnt/tank/retro/roms/PS3/pkgi-server
        target: /data/PS3
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/retro/roms/PS4
        target: /data/PS4
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/retro/metadata
        target: /config
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:mode=755,uid=1000,gid=1000
    ports:
      - 4444:8080
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true
  ps3netsrv:
    image: shawly/ps3netsrv
    container_name: ps3netsrv
    restart: unless-stopped
    environment:
      USER_ID: "1000"
      GROUP_ID: "1000"
      TZ: Europe/Warsaw
    volumes:
      - type: bind
        source: /mnt/tank/retro/roms/PS3
        target: /games
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/retro/roms/PS2
        target: /games/PS2ISO
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: /mnt/tank/retro/roms/PS1
        target: /games/PSXISO
        read_only: true
        bind:
          create_host_path: false
    ports:
      - 38008:38008
    # security
    security_opt:
      - no-new-privileges
