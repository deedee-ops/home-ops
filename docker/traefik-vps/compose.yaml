---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
# Pure L4 edge: no certificates, no docker provider. Everything on :443 is passed
# through, TLS intact, to envoy-external at home over the tailnet (see
# config/extra/tcp.yaml); :80 only redirects to https.
services:
  traefik:
    environment:
      TZ: Europe/Warsaw
    image: public.ecr.aws/docker/library/traefik:v3.7.18@sha256:9c437ac4f09ce6f4980a8544902d3475fdf70a1a7c578729581d2535dfa7d635
    container_name: traefik
    restart: always
    ports:
      - "80:80"
      - "443:443"
    configs:
      - source: traefik
        target: /etc/traefik/traefik.yml
      - source: extra-tcp
        target: /config/extra/tcp.yaml
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true

configs:
  traefik:
    file: ./config/traefik.yaml
  extra-tcp:
    file: ./config/extra/tcp.yaml
