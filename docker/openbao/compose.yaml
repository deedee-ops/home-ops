---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  openbao:
    image: ghcr.io/openbao/openbao:2.7.2@sha256:5046911075e137e154ce49ab051502f4ec7cf367d484ae4a4dce665d9b90561f
    container_name: openbao
    restart: unless-stopped
    command: server
    configs:
      - source: openbao-config
        target: /openbao/config/config.hcl
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - ${DATA_DOCKER_DIR}/openbao/data:/openbao/data
      - ${DATA_DOCKER_DIR}/openbao/secret:/secret:ro
    depends_on:
      openbao-unseal-secret:
        condition: service_completed_successfully
    networks:
      - internal
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - 8200:8200
    # security
    cap_add:
      - CAP_IPC_LOCK
    # traefik
    labels:
      traefik.enable: "true"
      traefik.http.services.openbao.loadbalancer.server.port: "8200"
      traefik.http.routers.openbao.entrypoints: https
      traefik.http.routers.openbao.rule: Host(`bao.${ROOT_DOMAIN}`)
      traefik.http.routers.openbao.service: openbao
      traefik.http.routers.openbao.tls: true
      traefik.http.routers.openbao.tls.certresolver: openbao-ecdsa
      traefik.http.routers.openbao.tls.domains[0].main: "bao.${ROOT_DOMAIN}"
    post_start:
      - command:
          - /bin/sh
          - -ec
          - 'until bao operator unseal "$(cat /secret/unseal-key)"; do sleep 1; done'

  openbao-unseal-secret:
    image: alpine:3.24@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: openbao-unseal-secret
    user: 100:1000
    restart: "no"
    environment:
      UNSEAL_KEY: "${UNSEAL_KEY}"
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        : "$${UNSEAL_KEY:?refusing to write an empty unseal key}"
        printf '%s' "$$UNSEAL_KEY" > /secret/unseal-key
    volumes:
      - ${DATA_DOCKER_DIR}/openbao/secret:/secret
    networks:
      - internal
    # security
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true

configs:
  openbao-config:
    file: ./config/config.hcl

networks:
  internal:
    name: internal
    external: true
