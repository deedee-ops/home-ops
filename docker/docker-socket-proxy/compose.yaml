---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  docker-socket-proxy:
    # Strict path allowlist: list/logs/stats/events only. Container inspect (env vars),
    # archive/export (file contents) and top (process args) are intentionally NOT allowed.
    command:
      - "-loglevel=info"
      - "-listenip=0.0.0.0"
      # only claude uses it, so limit it to its box
      - "-allowfrom=192.168.3.20/16"
      - "-allowHEAD=/_ping"
      - "-allowGET=(/v1\\.[0-9]+)?/(_ping|version|events|containers/json|containers/[a-zA-Z0-9][a-zA-Z0-9_.-]*/(logs|stats)|images/json|networks|volumes)"
      - "-watchdoginterval=3600"
      - "-stoponwatchdog"
      - "-shutdowngracetime=5"
    image: ghcr.io/wollomatic/socket-proxy:1.13.2@sha256:82db5c4728e4fd68d969ec3d74d99bf6d990d06428b583a6f1daabab27de1bd3
    container_name: docker-socket-proxy
    restart: unless-stopped
    user: 1000:1000
    group_add:
      - "999"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "2375:2375"
    mem_limit: 64M
    cap_drop:
      - all
    security_opt:
      - no-new-privileges
    read_only: true
