---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v2.17.3@sha256:3005364d5aa603a8fe8b51bee26413b473965c3c2dc6c152b0016dd1cdda1cf4
    container_name: arcane-agent
    restart: always
    environment:
      AGENT_MODE: "true"
      EDGE_TRANSPORT: poll
      AGENT_TOKEN: "${ARCANE_AGENT_TOKEN}"
      MANAGER_API_URL: http://localhost:3552
    ports:
      - "127.0.0.1:3553:3553"
    volumes:
      - ${DATA_DOCKER_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
