---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
# Bound to loopback only. The arcane manager on the NAS reaches it over the
# tailnet through `tailscale serve` on mandark (tcp/3553), see the ansible
# tailscale role and the tag:router -> tag:edge grant in opentofu/tailscale.tf.
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v2.15.1
    container_name: arcane-agent
    restart: always
    environment:
      AGENT_MODE: "true"
      EDGE_TRANSPORT: poll
      AGENT_TOKEN: "${ARCANE_AGENT_TOKEN}"
      MANAGER_API_URL: http://localhost:3552
    ports:
      - "127.0.0.1:3553:3553"
    volumes:
      - ${DATA_DOCKER_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
