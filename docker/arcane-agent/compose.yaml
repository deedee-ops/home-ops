---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v3.1.0@sha256:b04f29138e60a4b64205ae1f4ba50b7718ef11174ef9972b5d8ec5b6ea580e04
    container_name: arcane-agent
    restart: always
    environment:
      AGENT_MODE: "true"
      EDGE_TRANSPORT: poll
      AGENT_TOKEN: "${ARCANE_AGENT_TOKEN}"
      MANAGER_API_URL: http://localhost:3552
    ports:
      - "127.0.0.1:3553:3553"
    volumes:
      - ${DATA_DOCKER_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
