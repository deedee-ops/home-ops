---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v3.2.0@sha256:c0a5ed4b2bfa643153f5b31a11ec4a5ca843da8a65231a9161802fd5e60ae1af
    container_name: arcane-agent
    restart: always
    environment:
      ARCANE_AGENT: "true"
      ARCANE_AGENT_TOKEN: "${ARCANE_AGENT_TOKEN}"
      ARCANE_AGENT_TRANSPORT: "auto"
      ARCANE_MANAGER_API_URL: http://localhost:9120
      EDGE_TRANSPORT: poll
    ports:
      - "127.0.0.1:3553:3553"
    volumes:
      - ${DATA_DOCKER_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
