---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v2.17.2@sha256:6f18b6dc08b529a2df818b1f94df79cb23e5c06bb1b0625e5df065599009c80f
    container_name: arcane-agent
    restart: always
    environment:
      AGENT_MODE: "true"
      EDGE_TRANSPORT: poll
      AGENT_TOKEN: "${ARCANE_AGENT_TOKEN}"
      MANAGER_API_URL: http://localhost:3552
    ports:
      - "127.0.0.1:3553:3553"
    volumes:
      - ${DATA_DOCKER_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
