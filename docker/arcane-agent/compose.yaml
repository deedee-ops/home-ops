---
# yaml-language-server: $schema=https://schemas.ajgon.casa/other/docker-compose.json
services:
  arcane-agent:
    image: ghcr.io/getarcaneapp/agent:v3.1.1@sha256:63e9ed625daa26fb189fc1e52b0d96634c44b3668f831ecf5e07358f40ba8d73
    container_name: arcane-agent
    restart: always
    environment:
      ARCANE_AGENT: "true"
      ARCANE_AGENT_TOKEN: "${ARCANE_AGENT_TOKEN}"
      ARCANE_AGENT_TRANSPORT: "auto"
      ARCANE_MANAGER_API_URL: http://localhost:9120
      EDGE_TRANSPORT: poll
    ports:
      - "127.0.0.1:3553:3553"
    volumes:
      - ${DATA_DOCKER_DIR}/arcane:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
