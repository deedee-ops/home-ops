---
# yaml-language-server: $schema=https://www.schemastore.org/helmfile.json
# This helmfile is for extracting and installing Custom Resource Definitions (CRDs) from Helm charts.
# It is not intended to be used with helmfile apply or helmfile sync.
helmDefaults:
  args:
    - --include-crds
    - --no-hooks
  postRenderer: bash
  postRendererArgs:
    - -c
    - yq ea -e 'select(.kind == "CustomResourceDefinition")'
releases:
  - name: envoy-gateway
    namespace: network
    chart: oci://mirror.gcr.io/envoyproxy/gateway-helm
    version: 1.9.1
  - name: external-secrets
    namespace: external-secrets
    chart: oci://ghcr.io/external-secrets/charts/external-secrets
    version: 2.10.0
  - name: grafana-operator
    namespace: observability
    chart: oci://ghcr.io/grafana/helm-charts/grafana-operator
    version: 5.25.0
  - name: kopiur
    namespace: kopiur-system
    chart: oci://ghcr.io/home-operations/charts/kopiur
    version: 0.10.9
  - name: kube-prometheus-stack
    namespace: observability
    chart: oci://ghcr.io/prometheus-community/charts/kube-prometheus-stack
    version: 91.4.1
  - name: silence-operator
    namespace: observability
    chart: oci://gsoci.azurecr.io/charts/giantswarm/silence-operator
    version: 0.21.0
  - name: trust-manager
    namespace: cert-manager
    chart: oci://quay.io/jetstack/charts/trust-manager
    version: v0.25.0
